<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simi Invaders - Aventura Espacial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0f3d 0%, #2d1b4e 25%, #4a2c6b 50%, #3d4e8c 75%, #2e5f8f 100%);
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff, inset 0 0 30px rgba(255, 0, 255, 0.3);
            background: radial-gradient(ellipse at center, #1a2845 0%, #0d1520 60%, #000000 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            image-rendering: auto;
        }

        #stars {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        #effectsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 4;
            color: #ffee88;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 3px 3px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000, 0 0 10px #ffaa00;
            font-family: 'Press Start 2P', cursive;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 4px solid #ff0000;
            box-shadow: 0 0 20px #ff0000;
            text-align: center;
            color: #ff0000;
            display: none;
        }

        #gameOver h1 {
            font-size: 24px;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        #gameOver p {
            font-size: 12px;
            margin: 10px 0;
            color: #00ff00;
        }

        #gameOver button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00ff00;
            border: none;
            color: #000;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px #00ff00;
        }

        #gameOver button:hover {
            background: #00cc00;
            transform: scale(1.05);
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ff00;
        }

        #startScreen h1 {
            font-size: 28px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 3px 3px 6px #000;
            animation: pulse 2s infinite, gradient 3s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #startScreen .instructions {
            font-size: 10px;
            margin: 10px 0;
            color: #ffff00;
        }

        #startScreen button {
            margin-top: 30px;
            padding: 15px 30px;
            background: #ff00ff;
            border: 3px solid #00ffff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff00ff;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="stars" width="800" height="600"></canvas>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <canvas id="effectsCanvas" width="800" height="600"></canvas>

        <div id="ui">
            <div>PUNTOS: <span id="score">0</span></div>
            <div>VIDAS: <span id="lives">3</span></div>
            <div>NIVEL: <span id="level">1</span></div>
        </div>

        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p>PUNTOS FINALES: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">REINICIAR</button>
        </div>

        <div id="startScreen">
            <h1>🚀 SIMI INVADERS 🚀</h1>
            <div class="instructions">← → MOVER</div>
            <div class="instructions">ESPACIO DISPARAR</div>
            <div class="instructions">P PAUSAR</div>
            <button onclick="startGame()">INICIAR JUEGO</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const starsCanvas = document.getElementById('stars');
        const starsCtx = starsCanvas.getContext('2d');
        const effectsCanvas = document.getElementById('effectsCanvas');
        const effectsCtx = effectsCanvas.getContext('2d');

        // Game state
        let gameStarted = false;
        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let animationId;

        // Player
        const player = {
            x: 400,
            y: 520,
            width: 40,
            height: 40,
            speed: 5,
            color: '#ff6600'
        };

        // Bullets
        let bullets = [];
        const bulletSpeed = 7;

        // Enemies
        let enemies = [];
        let enemyBullets = [];
        const enemyTypes = [
            { name: 'planeta', color: '#ffaa00', points: 10, width: 30, height: 30 },
            { name: 'ufo', color: '#00ff88', points: 20, width: 35, height: 25 },
            { name: 'alien', color: '#ffff00', points: 15, width: 28, height: 28 },
            { name: 'satelite', color: '#00aaff', points: 25, width: 32, height: 32 }
        ];

        // Controls
        const keys = {};

        // Cuphead-style effects
        let particles = [];
        let filmGrainIntensity = 0.15;
        let filmFlicker = 0;
        let bounceAnimations = new Map(); // Para animaciones de bounce

        // Stars background
        const stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * starsCanvas.width,
                y: Math.random() * starsCanvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1
            });
        }

        // Cuphead-style particle system
        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6 - 2,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 1.0,
                    decay: Math.random() * 0.02 + 0.01,
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.3
                });
            }
        }

        function updateAndDrawParticles() {
            particles = particles.filter(p => p.life > 0);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3; // gravity
                p.life -= p.decay;
                p.rotation += p.rotationSpeed;

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);

                // Star-shaped particle (Cuphead style)
                ctx.fillStyle = p.color;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 4 * Math.PI) / 5;
                    const radius = i % 2 === 0 ? p.size : p.size / 2;
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();

                // Black outline
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();
            });
        }

        // Film grain effect
        function drawFilmGrain() {
            const imageData = effectsCtx.createImageData(effectsCanvas.width, effectsCanvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 255 * filmGrainIntensity;
                data[i] = noise;     // R
                data[i + 1] = noise; // G
                data[i + 2] = noise; // B
                data[i + 3] = Math.abs(noise) * 0.5; // A
            }

            effectsCtx.putImageData(imageData, 0, 0);
        }

        // Vignette effect
        function drawVignette() {
            const gradient = effectsCtx.createRadialGradient(
                effectsCanvas.width / 2, effectsCanvas.height / 2, 100,
                effectsCanvas.width / 2, effectsCanvas.height / 2, effectsCanvas.width * 0.8
            );
            gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
            gradient.addColorStop(0.7, 'rgba(0, 0, 0, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.5)');

            effectsCtx.fillStyle = gradient;
            effectsCtx.fillRect(0, 0, effectsCanvas.width, effectsCanvas.height);
        }

        // Film flicker effect
        function drawFilmFlicker() {
            filmFlicker = Math.sin(Date.now() / 50) * 0.03 + (Math.random() - 0.5) * 0.02;
            effectsCtx.globalAlpha = Math.abs(filmFlicker);
            effectsCtx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#000000';
            effectsCtx.fillRect(0, 0, effectsCanvas.width, effectsCanvas.height);
            effectsCtx.globalAlpha = 1.0;
        }

        // Scan lines
        function drawScanLines() {
            effectsCtx.globalAlpha = 0.05;
            effectsCtx.strokeStyle = '#000000';
            effectsCtx.lineWidth = 1;
            for (let i = 0; i < effectsCanvas.height; i += 3) {
                effectsCtx.beginPath();
                effectsCtx.moveTo(0, i);
                effectsCtx.lineTo(effectsCanvas.width, i);
                effectsCtx.stroke();
            }
            effectsCtx.globalAlpha = 1.0;
        }

        // Helper function to draw thick black outlines (Cuphead style)
        function strokeOutline(path, lineWidth = 3) {
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = lineWidth;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        // Main effects compositor
        function drawCupheadEffects() {
            effectsCtx.clearRect(0, 0, effectsCanvas.width, effectsCanvas.height);

            // Layer effects
            if (Math.random() > 0.97) {
                drawFilmFlicker();
            }

            drawFilmGrain();
            drawVignette();
            drawScanLines();
        }

        function drawStars() {
            starsCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            starsCtx.fillRect(0, 0, starsCanvas.width, starsCanvas.height);

            stars.forEach(star => {
                // Glow effect
                const starGlow = starsCtx.createRadialGradient(star.x, star.y, 0, star.x, star.y, star.size * 2);
                starGlow.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                starGlow.addColorStop(0.5, 'rgba(255, 255, 255, 0.4)');
                starGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                starsCtx.fillStyle = starGlow;
                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.size * 2, 0, Math.PI * 2);
                starsCtx.fill();

                // Star center
                starsCtx.fillStyle = '#ffffff';
                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.size / 2, 0, Math.PI * 2);
                starsCtx.fill();

                star.y += star.speed;
                if (star.y > starsCanvas.height) {
                    star.y = 0;
                    star.x = Math.random() * starsCanvas.width;
                }
            });
        }

        function drawPlayer() {
            const centerX = player.x + player.width / 2;
            const centerY = player.y + player.height / 2;

            // Rubber hose animation - exaggerated bounce
            const bounce = Math.sin(Date.now() / 150) * 3;
            const squash = 1 + Math.sin(Date.now() / 100) * 0.1;
            const armWave = Math.sin(Date.now() / 200);

            ctx.save();
            ctx.translate(0, bounce);

            // ========== CUPHEAD STYLE ASTRONAUT (based on mural) ==========

            // Jetpack fire behind (simplified)
            const fireFrame = Math.sin(Date.now() / 80) * 3;
            ctx.fillStyle = '#ff6600';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY + 20);
            ctx.quadraticCurveTo(centerX - 5, centerY + 25 + fireFrame, centerX - 3, centerY + 30 + fireFrame);
            ctx.quadraticCurveTo(centerX, centerY + 28 + fireFrame, centerX + 3, centerY + 30 + fireFrame);
            ctx.quadraticCurveTo(centerX + 5, centerY + 25 + fireFrame, centerX, centerY + 20);
            ctx.fill();

            ctx.fillStyle = '#ffdd00';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY + 22);
            ctx.quadraticCurveTo(centerX - 3, centerY + 24 + fireFrame, centerX, centerY + 27 + fireFrame);
            ctx.quadraticCurveTo(centerX + 3, centerY + 24 + fireFrame, centerX, centerY + 22);
            ctx.fill();

            // Body - SIMPLE OVAL (orange suit from mural)
            ctx.save();
            ctx.translate(centerX, centerY + 5);
            ctx.scale(1, squash);
            ctx.translate(-centerX, -(centerY + 5));

            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 5, 10, 14, 0, 0, Math.PI * 2);
            strokeOutline(ctx, 5);
            ctx.fillStyle = '#ff7722';
            ctx.fill();

            ctx.restore();

            // Rubber hose LEGS (black tubes with orange boots)
            // Left leg
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(centerX - 4, centerY + 16);
            const legBend = Math.sin(Date.now() / 300) * 2;
            ctx.quadraticCurveTo(centerX - 6, centerY + 22 + legBend, centerX - 5, centerY + 28);
            ctx.stroke();

            // Right leg
            ctx.beginPath();
            ctx.moveTo(centerX + 4, centerY + 16);
            ctx.quadraticCurveTo(centerX + 6, centerY + 22 - legBend, centerX + 5, centerY + 28);
            ctx.stroke();

            // Boots (simplified, from mural)
            ctx.beginPath();
            ctx.ellipse(centerX - 5, centerY + 30, 5, 4, 0, 0, Math.PI * 2);
            ctx.ellipse(centerX + 5, centerY + 30, 5, 4, 0, 0, Math.PI * 2);
            strokeOutline(ctx, 3);
            ctx.fillStyle = '#dd4422';
            ctx.fill();

            // Rubber hose ARMS (black tubes)
            // Left arm RAISED UP (like in mural - victory pose!)
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(centerX - 10, centerY + 2);
            ctx.quadraticCurveTo(centerX - 14 + armWave * 2, centerY - 3, centerX - 12, centerY - 8);
            ctx.stroke();

            // Right arm (down)
            ctx.beginPath();
            ctx.moveTo(centerX + 10, centerY + 2);
            ctx.quadraticCurveTo(centerX + 12 - armWave, centerY + 8, centerX + 11, centerY + 12);
            ctx.stroke();

            // HUGE WHITE GLOVES (Cuphead style!)
            // Left glove (raised - fist!)
            ctx.beginPath();
            ctx.arc(centerX - 12, centerY - 10, 6, 0, Math.PI * 2);
            strokeOutline(ctx, 3);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Thumb on fist
            ctx.beginPath();
            ctx.arc(centerX - 16, centerY - 8, 3, 0, Math.PI * 2);
            strokeOutline(ctx, 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Right glove (open hand)
            ctx.beginPath();
            ctx.ellipse(centerX + 11, centerY + 14, 5, 6, 0.3, 0, Math.PI * 2);
            strokeOutline(ctx, 3);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Fingers on open hand
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(centerX + 9 + i * 2, centerY + 9, 2, 0, Math.PI * 2);
                strokeOutline(ctx, 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            // HEAD - BIG ROUND HELMET (orange like mural)
            ctx.beginPath();
            ctx.arc(centerX, centerY - 8, 12, 0, Math.PI * 2);
            strokeOutline(ctx, 5);
            ctx.fillStyle = '#ffaa44';
            ctx.fill();

            // Helmet shine (simple highlight)
            ctx.fillStyle = '#ffdd88';
            ctx.beginPath();
            ctx.arc(centerX - 4, centerY - 13, 4, 0, Math.PI * 2);
            ctx.fill();

            // Visor WINDOW (cyan/blue - visible face area)
            ctx.beginPath();
            ctx.ellipse(centerX, centerY - 7, 9, 8, 0, 0, Math.PI * 2);
            strokeOutline(ctx, 3);
            ctx.fillStyle = 'rgba(100, 200, 255, 0.3)';
            ctx.fill();

            // HUGE CARTOON EYES (Cuphead style pie eyes!)
            const eyeBlink = Math.sin(Date.now() / 3000) > 0.95 ? 3 : 0;

            // Left eye (black pie cut)
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(centerX - 3, centerY - 8, 3, 0, Math.PI * 2);
            ctx.fill();

            // Right eye
            ctx.beginPath();
            ctx.arc(centerX + 3, centerY - 8, 3, 0, Math.PI * 2);
            ctx.fill();

            // White shine in eyes (Cuphead signature!)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(centerX - 2, centerY - 9, 1.5, 0, Math.PI * 2);
            ctx.arc(centerX + 4, centerY - 9, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // GIANT SMILE (from mural - huge happy grin!)
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(centerX, centerY - 3, 6, 0.1, Math.PI - 0.1);
            ctx.stroke();

            // Smile fill (white teeth showing)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(centerX, centerY - 3, 5, 0.1, Math.PI - 0.1);
            ctx.lineTo(centerX, centerY - 3);
            ctx.fill();

            // Tongue
            ctx.fillStyle = '#ff6666';
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 1, 2, 1.5, 0, 0, Math.PI);
            ctx.fill();

            ctx.restore();
        }

        function drawBullet(bullet) {
            ctx.save();

            // Glow effect (outer)
            const glowGradient = ctx.createRadialGradient(bullet.x + 2, bullet.y + 6, 0, bullet.x + 2, bullet.y + 6, 8);
            glowGradient.addColorStop(0, 'rgba(0, 255, 255, 0.8)');
            glowGradient.addColorStop(0.5, 'rgba(0, 255, 255, 0.3)');
            glowGradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
            ctx.fillStyle = glowGradient;
            ctx.fillRect(bullet.x - 4, bullet.y - 2, 12, 16);

            // Laser beam with gradient
            const laserGradient = ctx.createLinearGradient(bullet.x, bullet.y, bullet.x + 4, bullet.y);
            laserGradient.addColorStop(0, 'rgba(0, 255, 255, 0.6)');
            laserGradient.addColorStop(0.5, '#00ffff');
            laserGradient.addColorStop(1, 'rgba(0, 255, 255, 0.6)');
            ctx.fillStyle = laserGradient;
            ctx.beginPath();
            ctx.roundRect(bullet.x, bullet.y, 4, 12, 2);
            ctx.fill();

            // Inner bright core
            const coreGradient = ctx.createLinearGradient(bullet.x + 1, bullet.y, bullet.x + 3, bullet.y);
            coreGradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
            coreGradient.addColorStop(0.5, '#ffffff');
            coreGradient.addColorStop(1, 'rgba(255, 255, 255, 0.6)');
            ctx.fillStyle = coreGradient;
            ctx.fillRect(bullet.x + 1.5, bullet.y + 2, 1, 8);

            ctx.restore();
        }

        function drawEnemy(enemy) {
            const type = enemy.type;
            const centerX = enemy.x + type.width / 2;
            const centerY = enemy.y + type.height / 2;

            ctx.save();

            if (type.name === 'planeta') {
                // SATURN PLANET - Cuphead style (from mural)
                const wobble = Math.sin(Date.now() / 200 + centerX) * 1.5;
                const bounce = Math.sin(Date.now() / 300 + centerX) * 2;

                // Animated RING behind (wavy like rubber)
                ctx.beginPath();
                ctx.ellipse(centerX, centerY + bounce, 20, 6, wobble * 0.1, 0, Math.PI * 2);
                strokeOutline(ctx, 4);

                const ringGrad = ctx.createLinearGradient(centerX - 20, centerY, centerX + 20, centerY);
                ringGrad.addColorStop(0, '#ff8844');
                ringGrad.addColorStop(0.5, '#ffaa55');
                ringGrad.addColorStop(1, '#ff8844');
                ctx.fillStyle = ringGrad;
                ctx.fill();

                // PLANET BODY (simple circle - orange like mural)
                ctx.beginPath();
                ctx.arc(centerX, centerY, 13, 0, Math.PI * 2);
                strokeOutline(ctx, 5);
                ctx.fillStyle = '#ffaa44';
                ctx.fill();

                // Ring in front (bottom half)
                ctx.beginPath();
                ctx.ellipse(centerX, centerY, 20, 6, wobble * 0.1, Math.PI, Math.PI * 2);
                strokeOutline(ctx, 4);
                ctx.fillStyle = ringGrad;
                ctx.fill();

                // HUGE HAPPY EYES (Cuphead pie eyes)
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(centerX - 4, centerY - 3, 3.5, 0, Math.PI * 2);
                ctx.arc(centerX + 4, centerY - 3, 3.5, 0, Math.PI * 2);
                ctx.fill();

                // Eye whites (shine)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(centerX - 3, centerY - 4, 1.5, 0, Math.PI * 2);
                ctx.arc(centerX + 5, centerY - 4, 1.5, 0, Math.PI * 2);
                ctx.fill();

                // GIANT SMILE (like mural - super wide!)
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(centerX, centerY + 3, 8, 0.2, Math.PI - 0.2);
                ctx.stroke();

                // Smile teeth
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(centerX, centerY + 3, 7, 0.2, Math.PI - 0.2);
                ctx.lineTo(centerX, centerY + 3);
                ctx.fill();

                // Rosy CHEEKS (pink circles)
                ctx.fillStyle = '#ff9999';
                ctx.beginPath();
                ctx.arc(centerX - 10, centerY + 2, 3, 0, Math.PI * 2);
                ctx.arc(centerX + 10, centerY + 2, 3, 0, Math.PI * 2);
                ctx.fill();

            } else if (type.name === 'ufo') {
                // UFO - Cuphead style (green from mural)
                const hover = Math.sin(Date.now() / 250 + centerX) * 3;
                const wobble = Math.sin(Date.now() / 200 + centerX) * 0.1;

                // SAUCER BASE (simple ellipse - green)
                ctx.beginPath();
                ctx.ellipse(centerX, centerY + 5 + hover, 16, 6, wobble, 0, Math.PI * 2);
                strokeOutline(ctx, 4);
                ctx.fillStyle = '#00dd88';
                ctx.fill();

                // Saucer detail lines
                ctx.strokeStyle = '#009966';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(centerX, centerY + 5 + hover, 14, 5, wobble, 0, Math.PI * 2);
                ctx.stroke();

                // DOME (half circle on top - lighter green)
                ctx.beginPath();
                ctx.arc(centerX, centerY + hover, 9, Math.PI, 0, false);
                ctx.closePath();
                strokeOutline(ctx, 4);
                ctx.fillStyle = '#88ffcc';
                ctx.fill();

                // Dome highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(centerX - 3, centerY - 4 + hover, 3, 0, Math.PI * 2);
                ctx.fill();

                // WINDOWS (simple black circles)
                ctx.fillStyle = '#004433';
                ctx.beginPath();
                ctx.arc(centerX - 5, centerY + 1 + hover, 2, 0, Math.PI * 2);
                ctx.arc(centerX, centerY + 1 + hover, 2, 0, Math.PI * 2);
                ctx.arc(centerX + 5, centerY + 1 + hover, 2, 0, Math.PI * 2);
                ctx.fill();

                // LIGHT BEAM (animated - simple triangles)
                const blink = Math.floor(Date.now() / 150) % 4;
                if (blink < 3) {
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
                    ctx.beginPath();
                    ctx.moveTo(centerX - 4, centerY + 10 + hover);
                    ctx.lineTo(centerX - 8, centerY + 18 + hover);
                    ctx.lineTo(centerX + 8, centerY + 18 + hover);
                    ctx.lineTo(centerX + 4, centerY + 10 + hover);
                    ctx.closePath();
                    ctx.fill();

                    // Light circles at bottom
                    const colors = ['#ffff00', '#00ffff', '#ff00ff'];
                    ctx.fillStyle = colors[blink];
                    ctx.beginPath();
                    ctx.arc(centerX - 6, centerY + 11 + hover, 3, 0, Math.PI * 2);
                    ctx.arc(centerX, centerY + 11 + hover, 3, 0, Math.PI * 2);
                    ctx.arc(centerX + 6, centerY + 11 + hover, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

            } else if (type.name === 'alien') {
                // ONE-EYED ALIEN - Cuphead style (yellow from mural!)
                const pulse = 1 + Math.sin(Date.now() / 200 + centerX) * 0.12;
                const bob = Math.sin(Date.now() / 400 + centerX) * 2;

                // BODY (simple circle/blob - yellow)
                ctx.save();
                ctx.translate(centerX, centerY + bob);
                ctx.scale(pulse, 1 / pulse); // Squash and stretch!
                ctx.translate(-centerX, -(centerY + bob));

                ctx.beginPath();
                ctx.arc(centerX, centerY + bob, 14, 0, Math.PI * 2);
                strokeOutline(ctx, 5);
                ctx.fillStyle = '#ffdd33';
                ctx.fill();

                ctx.restore();

                // Tiny ANTENNA on top (wobbles)
                const antennaWobble = Math.sin(Date.now() / 150 + centerX) * 0.3;
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(centerX, centerY - 14 + bob);
                ctx.quadraticCurveTo(centerX + antennaWobble * 3, centerY - 18 + bob, centerX, centerY - 20 + bob);
                ctx.stroke();

                // Antenna ball
                ctx.beginPath();
                ctx.arc(centerX, centerY - 20 + bob, 3, 0, Math.PI * 2);
                strokeOutline(ctx, 2);
                ctx.fillStyle = '#ff8800';
                ctx.fill();

                // ONE MASSIVE EYE (like from mural!)
                // Eye white
                ctx.beginPath();
                ctx.arc(centerX, centerY + bob, 9, 0, Math.PI * 2);
                strokeOutline(ctx, 3);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // Iris (blue gradient)
                ctx.beginPath();
                ctx.arc(centerX, centerY + bob, 6, 0, Math.PI * 2);
                const irisGrad = ctx.createRadialGradient(centerX - 2, centerY - 2 + bob, 1, centerX, centerY + bob, 6);
                irisGrad.addColorStop(0, '#0099ff');
                irisGrad.addColorStop(1, '#0055cc');
                ctx.fillStyle = irisGrad;
                ctx.fill();

                // Black pupil
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(centerX + 1, centerY + 1 + bob, 3, 0, Math.PI * 2);
                ctx.fill();

                // BIG shine (Cuphead signature!)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(centerX - 2, centerY - 2 + bob, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // Tiny MOUTH (simple curve)
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(centerX, centerY + 10 + bob, 4, 0.3, Math.PI - 0.3);
                ctx.stroke();

            } else if (type.name === 'satelite') {
                // SATELLITE - Cuphead style (blue/silver from mural)
                const spin = Math.sin(Date.now() / 400 + centerX) * 0.15;
                const float = Math.sin(Date.now() / 350 + centerX) * 2;

                // SOLAR PANELS (simple rectangles - blue)
                // Left panel
                ctx.save();
                ctx.translate(centerX - 12, centerY + float);
                ctx.rotate(spin);
                ctx.translate(-(centerX - 12), -(centerY + float));

                ctx.beginPath();
                ctx.rect(centerX - 20, centerY - 6 + float, 10, 12);
                strokeOutline(ctx, 4);
                ctx.fillStyle = '#3399ff';
                ctx.fill();

                // Simple grid lines on panel
                ctx.strokeStyle = '#0066cc';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX - 15, centerY - 6 + float);
                ctx.lineTo(centerX - 15, centerY + 6 + float);
                ctx.stroke();

                ctx.restore();

                // Right panel
                ctx.save();
                ctx.translate(centerX + 12, centerY + float);
                ctx.rotate(-spin);
                ctx.translate(-(centerX + 12), -(centerY + float));

                ctx.beginPath();
                ctx.rect(centerX + 10, centerY - 6 + float, 10, 12);
                strokeOutline(ctx, 4);
                ctx.fillStyle = '#3399ff';
                ctx.fill();

                // Grid lines
                ctx.strokeStyle = '#0066cc';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX + 15, centerY - 6 + float);
                ctx.lineTo(centerX + 15, centerY + 6 + float);
                ctx.stroke();

                ctx.restore();

                // MAIN BODY (simple rounded rectangle - silver/gray)
                ctx.beginPath();
                ctx.roundRect(centerX - 6, centerY - 8 + float, 12, 16, 3);
                strokeOutline(ctx, 5);
                ctx.fillStyle = '#ccddee';
                ctx.fill();

                // Body highlight (simple stripe)
                ctx.fillStyle = '#eeffff';
                ctx.beginPath();
                ctx.roundRect(centerX - 4, centerY - 6 + float, 3, 12, 1);
                ctx.fill();

                // Simple ANTENNA on top (wobbles)
                const antennaWobble = Math.sin(Date.now() / 180 + centerX) * 0.2;
                ctx.strokeStyle = '#888888';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(centerX, centerY - 8 + float);
                ctx.quadraticCurveTo(centerX + antennaWobble * 4, centerY - 12 + float, centerX, centerY - 14 + float);
                ctx.stroke();

                // Antenna dish (simple circle)
                ctx.beginPath();
                ctx.arc(centerX, centerY - 14 + float, 4, 0, Math.PI * 2);
                strokeOutline(ctx, 3);
                ctx.fillStyle = '#ffdd88';
                ctx.fill();

                // BLINKING LIGHT (Cuphead style - center)
                const blink = Math.floor(Date.now() / 250) % 3;
                if (blink === 0) {
                    ctx.beginPath();
                    ctx.arc(centerX, centerY + float, 3, 0, Math.PI * 2);
                    strokeOutline(ctx, 2);
                    ctx.fillStyle = '#ff3333';
                    ctx.fill();

                    // White center shine
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(centerX - 1, centerY - 1 + float, 1, 0, Math.PI * 2);
                    ctx.fill();
                }

                // SIMPLE FACE ELEMENTS (Cuphead style)
                // Two small eyes (dots)
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(centerX - 3, centerY - 2 + float, 1.5, 0, Math.PI * 2);
                ctx.arc(centerX + 3, centerY - 2 + float, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawEnemyBullet(bullet) {
            ctx.save();

            // Outer glow
            const glowGradient = ctx.createRadialGradient(bullet.x + 3, bullet.y + 4, 0, bullet.x + 3, bullet.y + 4, 10);
            glowGradient.addColorStop(0, 'rgba(255, 100, 0, 0.6)');
            glowGradient.addColorStop(0.5, 'rgba(255, 0, 0, 0.3)');
            glowGradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = glowGradient;
            ctx.beginPath();
            ctx.arc(bullet.x + 3, bullet.y + 4, 8, 0, Math.PI * 2);
            ctx.fill();

            // Energy ball with gradient (red to yellow center)
            const ballGradient = ctx.createRadialGradient(bullet.x + 3, bullet.y + 3, 1, bullet.x + 3, bullet.y + 4, 5);
            ballGradient.addColorStop(0, '#ffff00');
            ballGradient.addColorStop(0.4, '#ff8800');
            ballGradient.addColorStop(0.7, '#ff3300');
            ballGradient.addColorStop(1, '#cc0000');
            ctx.fillStyle = ballGradient;
            ctx.beginPath();
            ctx.arc(bullet.x + 3, bullet.y + 4, 4, 0, Math.PI * 2);
            ctx.fill();

            // Bright center
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(bullet.x + 2, bullet.y + 3, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Flame trail
            const trailGradient = ctx.createLinearGradient(bullet.x + 3, bullet.y + 8, bullet.x + 3, bullet.y + 12);
            trailGradient.addColorStop(0, 'rgba(255, 100, 0, 0.6)');
            trailGradient.addColorStop(0.5, 'rgba(255, 50, 0, 0.3)');
            trailGradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = trailGradient;
            ctx.beginPath();
            ctx.moveTo(bullet.x + 3, bullet.y + 8);
            ctx.lineTo(bullet.x + 1, bullet.y + 11);
            ctx.lineTo(bullet.x + 5, bullet.y + 11);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function createEnemies() {
            enemies = [];
            const rows = 3 + Math.floor(level / 2);
            const cols = 6 + Math.floor(level / 3);
            const spacing = 60;
            const startX = 50;
            const startY = 50;

            for (let row = 0; row < Math.min(rows, 5); row++) {
                for (let col = 0; col < Math.min(cols, 10); col++) {
                    const typeIndex = Math.floor(Math.random() * enemyTypes.length);
                    enemies.push({
                        x: startX + col * spacing,
                        y: startY + row * 50,
                        type: enemyTypes[typeIndex],
                        direction: 1,
                        shootCooldown: Math.random() * 100
                    });
                }
            }
        }

        function updatePlayer() {
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
        }

        function updateBullets() {
            bullets = bullets.filter(bullet => {
                bullet.y -= bulletSpeed;
                return bullet.y > 0;
            });

            enemyBullets = enemyBullets.filter(bullet => {
                bullet.y += 3;
                return bullet.y < canvas.height;
            });
        }

        function updateEnemies() {
            let changeDirection = false;

            enemies.forEach(enemy => {
                enemy.x += enemy.direction * 0.5;

                if (enemy.x <= 0 || enemy.x >= canvas.width - enemy.type.width) {
                    changeDirection = true;
                }

                // Enemy shooting
                enemy.shootCooldown--;
                if (enemy.shootCooldown <= 0 && Math.random() < 0.002) {
                    enemyBullets.push({
                        x: enemy.x + enemy.type.width / 2,
                        y: enemy.y + enemy.type.height
                    });
                    enemy.shootCooldown = 100 + Math.random() * 100;
                }
            });

            if (changeDirection) {
                enemies.forEach(enemy => {
                    enemy.direction *= -1;
                    enemy.y += 10;
                });
            }
        }

        function checkCollisions() {
            // Bullet hits enemy
            bullets.forEach((bullet, bulletIndex) => {
                enemies.forEach((enemy, enemyIndex) => {
                    if (bullet.x >= enemy.x && bullet.x <= enemy.x + enemy.type.width &&
                        bullet.y >= enemy.y && bullet.y <= enemy.y + enemy.type.height) {
                        bullets.splice(bulletIndex, 1);

                        // Create explosion particles (Cuphead style)
                        const enemyX = enemy.x + enemy.type.width / 2;
                        const enemyY = enemy.y + enemy.type.height / 2;
                        createParticles(enemyX, enemyY, enemy.type.color, 15);
                        createParticles(enemyX, enemyY, '#ffff00', 8);
                        createParticles(enemyX, enemyY, '#ffffff', 5);

                        enemies.splice(enemyIndex, 1);
                        score += enemy.type.points;
                        document.getElementById('score').textContent = score;
                    }
                });
            });

            // Enemy bullet hits player
            enemyBullets.forEach((bullet, bulletIndex) => {
                if (bullet.x >= player.x && bullet.x <= player.x + player.width &&
                    bullet.y >= player.y && bullet.y <= player.y + player.height) {
                    enemyBullets.splice(bulletIndex, 1);
                    lives--;
                    document.getElementById('lives').textContent = lives;

                    if (lives <= 0) {
                        endGame();
                    }
                }
            });

            // Enemy reaches bottom
            enemies.forEach(enemy => {
                if (enemy.y + enemy.type.height >= player.y) {
                    endGame();
                }
            });

            // Level complete
            if (enemies.length === 0) {
                level++;
                document.getElementById('level').textContent = level;
                createEnemies();
            }
        }

        function shoot() {
            bullets.push({
                x: player.x + player.width / 2,
                y: player.y
            });
        }

        function gameLoop() {
            if (!gameRunning) return;

            drawStars();

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updatePlayer();
            updateBullets();
            updateEnemies();
            checkCollisions();

            drawPlayer();
            bullets.forEach(drawBullet);
            enemies.forEach(drawEnemy);
            enemyBullets.forEach(drawEnemyBullet);
            updateAndDrawParticles();

            // Cuphead-style effects overlay
            drawCupheadEffects();

            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (gameStarted) return;

            gameStarted = true;
            gameRunning = true;
            document.getElementById('startScreen').style.display = 'none';

            score = 0;
            lives = 3;
            level = 1;
            bullets = [];
            enemyBullets = [];

            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;

            createEnemies();
            gameLoop();
        }

        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            gameStarted = false;
            startGame();
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (e.key === ' ' && gameRunning) {
                e.preventDefault();
                shoot();
            }

            if (e.key === 'p' || e.key === 'P') {
                gameRunning = !gameRunning;
                if (gameRunning) gameLoop();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Start star animation
        setInterval(drawStars, 50);
    </script>
</body>
</html>
