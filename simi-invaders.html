<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simi Invaders - Aventura Espacial Retro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1410;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 960px;
            height: 720px;
            border: 8px solid #3d2817;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.5);
            background: #000;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            image-rendering: auto;
        }

        #bgCanvas { z-index: 1; }
        #gameCanvas { z-index: 2; }
        #fxCanvas { z-index: 3; pointer-events: none; }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 4;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 4px 4px 0px #000, -2px -2px 0px #000;
            font-family: 'Courier New', monospace;
            line-height: 1.8;
        }

        .hp-container {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .hp-heart {
            width: 24px;
            height: 24px;
            background: #ff3333;
            border: 3px solid #000;
            border-radius: 50%;
            position: relative;
        }

        .hp-heart::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 8px;
            height: 8px;
            background: #ffaaaa;
            border-radius: 50%;
        }

        #gameOver, #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        #gameOver {
            display: none;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 30px;
            color: #ffdd44;
            text-shadow: 6px 6px 0px #000, -2px -2px 0px #cc8800;
            animation: wobble 2s infinite;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(-2deg) scale(1); }
            25% { transform: rotate(2deg) scale(1.05); }
            50% { transform: rotate(-1deg) scale(1); }
            75% { transform: rotate(1deg) scale(1.05); }
        }

        .instructions {
            font-size: 14px;
            margin: 8px 0;
            color: #ffeecc;
            text-shadow: 2px 2px 0px #000;
        }

        button {
            margin-top: 30px;
            padding: 15px 40px;
            background: #ffdd44;
            border: 5px solid #000;
            color: #000;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-shadow: none;
            box-shadow: 5px 5px 0px #aa8800;
            transition: all 0.1s;
        }

        button:hover {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0px #aa8800;
        }

        button:active {
            transform: translate(5px, 5px);
            box-shadow: 0px 0px 0px #aa8800;
        }

        #finalScore {
            color: #ffdd44;
            font-size: 24px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="bgCanvas" width="960" height="720"></canvas>
        <canvas id="gameCanvas" width="960" height="720"></canvas>
        <canvas id="fxCanvas" width="960" height="720"></canvas>

        <div id="ui">
            <div>PUNTOS: <span id="score">0</span></div>
            <div class="hp-container" id="hpContainer"></div>
            <div style="margin-top: 8px;">NIVEL: <span id="level">1</span></div>
        </div>

        <div id="gameOver">
            <h1>¡JUEGO TERMINADO!</h1>
            <div id="finalScore">PUNTOS: 0</div>
            <button onclick="restartGame()">REINTENTAR</button>
        </div>

        <div id="startScreen">
            <h1>SIMI INVADERS</h1>
            <div class="instructions">← → MOVER</div>
            <div class="instructions">ESPACIO DISPARAR</div>
            <div class="instructions">P PAUSAR</div>
            <button onclick="startGame()">¡COMENZAR!</button>
        </div>
    </div>

    <script>
        // Canvas setup
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const fxCanvas = document.getElementById('fxCanvas');
        const fxCtx = fxCanvas.getContext('2d');

        // Game state
        let gameStarted = false;
        let gameRunning = false;
        let score = 0;
        let hp = 3;
        let level = 1;
        let animationId;
        let frameCount = 0;

        // Player (Astronauta Doctor Simi)
        const player = {
            x: 460,
            y: 600,
            width: 60,
            height: 60,
            speed: 6,
            shootCooldown: 0
        };

        // Bullets and enemies
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let particles = [];
        let explosions = [];

        // Controls
        const keys = {};

        // Background elements
        let bgClouds = [];
        let bgStars = [];
        let bgMountains = [];

        // Initialize background
        function initBackground() {
            // Create stars
            for (let i = 0; i < 80; i++) {
                bgStars.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height * 0.6,
                    size: Math.random() * 2 + 0.5,
                    twinkle: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.3 + 0.1
                });
            }

            // Create clouds
            for (let i = 0; i < 12; i++) {
                bgClouds.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * 200 + 50,
                    width: Math.random() * 150 + 80,
                    height: Math.random() * 60 + 30,
                    speed: Math.random() * 0.3 + 0.1,
                    opacity: Math.random() * 0.3 + 0.2
                });
            }

            // Create mountain layers
            for (let layer = 0; layer < 3; layer++) {
                bgMountains[layer] = [];
                const points = 15;
                for (let i = 0; i <= points; i++) {
                    bgMountains[layer].push({
                        x: (i / points) * bgCanvas.width,
                        y: 400 + Math.random() * 100 - layer * 30,
                        baseY: 720
                    });
                }
            }
        }

        // Draw painted background (Cuphead style)
        function drawBackground() {
            // Sky gradient (vintage pinkish-purple like Cuphead)
            const skyGradient = bgCtx.createLinearGradient(0, 0, 0, bgCanvas.height * 0.6);
            skyGradient.addColorStop(0, '#4a2c5e');      // Deep purple top
            skyGradient.addColorStop(0.3, '#6b3d6d');    // Purple-pink
            skyGradient.addColorStop(0.5, '#8d5474');    // Mauve
            skyGradient.addColorStop(0.7, '#b06d7a');    // Dusty rose
            skyGradient.addColorStop(1, '#d4917e');      // Peachy horizon

            bgCtx.fillStyle = skyGradient;
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            // Add texture to sky
            bgCtx.globalAlpha = 0.03;
            for (let i = 0; i < 2000; i++) {
                bgCtx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
                bgCtx.fillRect(
                    Math.random() * bgCanvas.width,
                    Math.random() * bgCanvas.height * 0.6,
                    1, 1
                );
            }
            bgCtx.globalAlpha = 1;

            // Twinkling stars
            bgStars.forEach(star => {
                star.twinkle += 0.05;
                const brightness = (Math.sin(star.twinkle) + 1) / 2;
                bgCtx.fillStyle = `rgba(255, 255, 255, ${brightness * 0.8})`;
                bgCtx.beginPath();
                bgCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                bgCtx.fill();

                // Star glow
                const glowGrad = bgCtx.createRadialGradient(star.x, star.y, 0, star.x, star.y, star.size * 3);
                glowGrad.addColorStop(0, `rgba(255, 255, 200, ${brightness * 0.4})`);
                glowGrad.addColorStop(1, 'rgba(255, 255, 200, 0)');
                bgCtx.fillStyle = glowGrad;
                bgCtx.beginPath();
                bgCtx.arc(star.x, star.y, star.size * 3, 0, Math.PI * 2);
                bgCtx.fill();

                star.y += star.speed;
                if (star.y > bgCanvas.height * 0.6) {
                    star.y = 0;
                    star.x = Math.random() * bgCanvas.width;
                }
            });

            // Painted clouds (Cuphead style - organic shapes)
            bgClouds.forEach(cloud => {
                bgCtx.save();
                bgCtx.globalAlpha = cloud.opacity;

                // Dark purple clouds
                bgCtx.fillStyle = '#2d1b3d';
                bgCtx.strokeStyle = '#1a0f28';
                bgCtx.lineWidth = 2;
                bgCtx.lineJoin = 'round';

                bgCtx.beginPath();
                const segments = 8;
                for (let i = 0; i <= segments; i++) {
                    const angle = (i / segments) * Math.PI;
                    const wobble = Math.sin(frameCount * 0.01 + i) * 5;
                    const x = cloud.x + Math.cos(angle) * cloud.width / 2 + wobble;
                    const y = cloud.y + Math.sin(angle) * cloud.height / 2;

                    if (i === 0) bgCtx.moveTo(x, y);
                    else bgCtx.lineTo(x, y);
                }
                bgCtx.closePath();
                bgCtx.fill();
                bgCtx.stroke();

                // Add texture to clouds
                bgCtx.globalAlpha = cloud.opacity * 0.3;
                for (let i = 0; i < 30; i++) {
                    bgCtx.fillStyle = '#1a0f28';
                    const px = cloud.x + (Math.random() - 0.5) * cloud.width;
                    const py = cloud.y + (Math.random() - 0.5) * cloud.height;
                    bgCtx.fillRect(px, py, 2, 2);
                }

                bgCtx.restore();

                cloud.x -= cloud.speed;
                if (cloud.x < -cloud.width) {
                    cloud.x = bgCanvas.width + cloud.width;
                    cloud.y = Math.random() * 200 + 50;
                }
            });

            // Ground/space terrain (layered mountains - Cuphead style)
            bgMountains.forEach((layer, layerIndex) => {
                const darkness = 0.3 + layerIndex * 0.15;
                const hue = 280 - layerIndex * 20; // Purple to brown gradient

                bgCtx.fillStyle = `hsl(${hue}, 30%, ${darkness * 100}%)`;
                bgCtx.strokeStyle = `hsl(${hue}, 30%, ${(darkness - 0.1) * 100}%)`;
                bgCtx.lineWidth = 3;
                bgCtx.lineJoin = 'round';

                bgCtx.beginPath();
                bgCtx.moveTo(0, bgCanvas.height);

                layer.forEach((point, i) => {
                    const wobble = Math.sin(frameCount * 0.005 + i) * 3;
                    if (i === 0) {
                        bgCtx.lineTo(point.x, point.y + wobble);
                    } else {
                        const prevPoint = layer[i - 1];
                        const cpX = (prevPoint.x + point.x) / 2;
                        const cpY = Math.min(prevPoint.y, point.y) - 20;
                        bgCtx.quadraticCurveTo(cpX, cpY + wobble, point.x, point.y + wobble);
                    }
                });

                bgCtx.lineTo(bgCanvas.width, bgCanvas.height);
                bgCtx.closePath();
                bgCtx.fill();
                bgCtx.stroke();

                // Add rocky texture
                bgCtx.save();
                bgCtx.clip();
                bgCtx.globalAlpha = 0.2;
                for (let i = 0; i < 100; i++) {
                    bgCtx.fillStyle = Math.random() > 0.5 ? '#000' : '#fff';
                    const px = Math.random() * bgCanvas.width;
                    const py = Math.random() * 300 + 420;
                    bgCtx.fillRect(px, py, Math.random() * 3 + 1, Math.random() * 3 + 1);
                }
                bgCtx.restore();
            });
        }

        // Helper: Thick cartoon outlines
        function outlineStroke(thickness = 4) {
            ctx.strokeStyle = '#000';
            ctx.lineWidth = thickness;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        // Draw player (Astronaut from mural - Cuphead style)
        function drawPlayer() {
            const px = player.x + player.width / 2;
            const py = player.y + player.height / 2;

            // Animation values
            const bounce = Math.sin(frameCount * 0.08) * 4;
            const squash = 1 + Math.sin(frameCount * 0.12) * 0.08;
            const armSwing = Math.sin(frameCount * 0.1) * 0.3;

            ctx.save();
            ctx.translate(0, bounce);

            // Jetpack flames (behind)
            if (frameCount % 4 < 2) {
                ctx.fillStyle = '#ff6600';
                ctx.beginPath();
                ctx.ellipse(px - 8, py + 22, 6, 12, 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffdd00';
                ctx.beginPath();
                ctx.ellipse(px - 8, py + 20, 4, 8, 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ff6600';
                ctx.beginPath();
                ctx.ellipse(px + 8, py + 22, 6, 12, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffdd00';
                ctx.beginPath();
                ctx.ellipse(px + 8, py + 20, 4, 8, -0.3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Body (orange spacesuit - squash and stretch)
            ctx.save();
            ctx.translate(px, py);
            ctx.scale(1, squash);
            ctx.translate(-px, -py);

            ctx.beginPath();
            ctx.ellipse(px, py + 5, 16, 20, 0, 0, Math.PI * 2);
            outlineStroke(5);
            const bodyGrad = ctx.createRadialGradient(px - 5, py, 5, px, py + 5, 20);
            bodyGrad.addColorStop(0, '#ff9944');
            bodyGrad.addColorStop(1, '#ee7722');
            ctx.fillStyle = bodyGrad;
            ctx.fill();

            ctx.restore();

            // Rubber hose legs
            const legBend = Math.sin(frameCount * 0.15) * 3;

            // Left leg
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(px - 6, py + 20);
            ctx.quadraticCurveTo(px - 10, py + 28 + legBend, px - 8, py + 38);
            ctx.stroke();

            // Right leg
            ctx.beginPath();
            ctx.moveTo(px + 6, py + 20);
            ctx.quadraticCurveTo(px + 10, py + 28 - legBend, px + 8, py + 38);
            ctx.stroke();

            // Boots
            ctx.beginPath();
            ctx.ellipse(px - 8, py + 40, 7, 5, 0, 0, Math.PI * 2);
            ctx.ellipse(px + 8, py + 40, 7, 5, 0, 0, Math.PI * 2);
            outlineStroke(4);
            ctx.fillStyle = '#cc3322';
            ctx.fill();

            // Rubber hose arms
            // Left arm (raised)
            ctx.strokeStyle = '#ff7722';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(px - 14, py + 3);
            ctx.quadraticCurveTo(px - 22 + armSwing * 10, py - 8, px - 18, py - 15);
            ctx.stroke();

            ctx.strokeStyle = '#000';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(px - 14, py + 3);
            ctx.quadraticCurveTo(px - 22 + armSwing * 10, py - 8, px - 18, py - 15);
            outlineStroke(3);

            // Right arm
            ctx.strokeStyle = '#ff7722';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(px + 14, py + 3);
            ctx.quadraticCurveTo(px + 18 - armSwing * 5, py + 12, px + 16, py + 18);
            ctx.stroke();

            ctx.strokeStyle = '#000';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(px + 14, py + 3);
            ctx.quadraticCurveTo(px + 18 - armSwing * 5, py + 12, px + 16, py + 18);
            outlineStroke(3);

            // Gloves (huge white cartoon gloves!)
            // Left glove (fist raised)
            ctx.beginPath();
            ctx.arc(px - 18, py - 18, 8, 0, Math.PI * 2);
            outlineStroke(4);
            ctx.fillStyle = '#fff';
            ctx.fill();

            // Thumb
            ctx.beginPath();
            ctx.arc(px - 24, py - 14, 4, 0, Math.PI * 2);
            outlineStroke(3);
            ctx.fillStyle = '#fff';
            ctx.fill();

            // Right glove (open hand)
            ctx.beginPath();
            ctx.ellipse(px + 16, py + 20, 7, 9, 0.2, 0, Math.PI * 2);
            outlineStroke(4);
            ctx.fillStyle = '#fff';
            ctx.fill();

            // Fingers
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(px + 13 + i * 3, py + 14, 3, 0, Math.PI * 2);
                outlineStroke(2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }

            // Helmet (big round)
            ctx.beginPath();
            ctx.arc(px, py - 12, 18, 0, Math.PI * 2);
            outlineStroke(6);
            const helmetGrad = ctx.createRadialGradient(px - 8, py - 18, 5, px, py - 12, 18);
            helmetGrad.addColorStop(0, '#ffcc77');
            helmetGrad.addColorStop(1, '#dd9944');
            ctx.fillStyle = helmetGrad;
            ctx.fill();

            // Helmet shine
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(px - 6, py - 18, 6, 0, Math.PI * 2);
            ctx.fill();

            // Visor (glass window)
            ctx.beginPath();
            ctx.ellipse(px, py - 11, 13, 11, 0, 0, Math.PI * 2);
            outlineStroke(4);
            const visorGrad = ctx.createLinearGradient(px, py - 22, px, py);
            visorGrad.addColorStop(0, 'rgba(120, 200, 255, 0.6)');
            visorGrad.addColorStop(1, 'rgba(80, 150, 220, 0.3)');
            ctx.fillStyle = visorGrad;
            ctx.fill();

            // Visor reflection
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath();
            ctx.ellipse(px - 4, py - 16, 5, 3, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Face through visor
            // Big cartoon eyes (pie eyes!)
            const eyeBlink = (frameCount % 120 > 115) ? 4 : 0;

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(px - 5, py - 12, 4, 5 - eyeBlink, 0, 0, Math.PI * 2);
            ctx.ellipse(px + 5, py - 12, 4, 5 - eyeBlink, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pupils
            if (eyeBlink === 0) {
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(px - 5, py - 11, 3, 0, Math.PI * 2);
                ctx.arc(px + 5, py - 11, 3, 0, Math.PI * 2);
                ctx.fill();

                // Eye shine
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(px - 4, py - 13, 1.5, 0, Math.PI * 2);
                ctx.arc(px + 6, py - 13, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Big smile
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(px, py - 6, 8, 0.2, Math.PI - 0.2);
            ctx.stroke();

            // Teeth
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(px, py - 6, 6.5, 0.2, Math.PI - 0.2);
            ctx.lineTo(px, py - 6);
            ctx.fill();

            ctx.restore();
        }

        // Enemy types (based on mural characters)
        const enemyTypes = {
            planet: {
                name: 'planeta',
                width: 50,
                height: 50,
                points: 100,
                color: '#ffaa44',
                shootChance: 0.003
            },
            ufo: {
                name: 'ovni',
                width: 55,
                height: 45,
                points: 150,
                color: '#44ddaa',
                shootChance: 0.005
            },
            alien: {
                name: 'alien',
                width: 48,
                height: 48,
                points: 125,
                color: '#ffdd44',
                shootChance: 0.004
            },
            satellite: {
                name: 'satelite',
                width: 52,
                height: 52,
                points: 175,
                color: '#88ccff',
                shootChance: 0.006
            }
        };

        // Draw enemy
        function drawEnemy(enemy) {
            const type = enemy.type;
            const ex = enemy.x + type.width / 2;
            const ey = enemy.y + type.height / 2;

            ctx.save();

            if (type.name === 'planeta') {
                // Saturn-like planet (from mural)
                const wobble = Math.sin(frameCount * 0.04 + enemy.x) * 0.1;
                const pulse = 1 + Math.sin(frameCount * 0.06 + enemy.x) * 0.05;

                ctx.save();
                ctx.translate(ex, ey);
                ctx.scale(pulse, pulse);
                ctx.rotate(wobble);
                ctx.translate(-ex, -ey);

                // Ring behind
                ctx.beginPath();
                ctx.ellipse(ex, ey, 28, 10, 0.2, 0, Math.PI * 2);
                outlineStroke(4);
                const ringGrad = ctx.createLinearGradient(ex - 28, ey, ex + 28, ey);
                ringGrad.addColorStop(0, '#dd8833');
                ringGrad.addColorStop(0.5, '#ffaa55');
                ringGrad.addColorStop(1, '#dd8833');
                ctx.fillStyle = ringGrad;
                ctx.fill();

                // Planet body
                ctx.beginPath();
                ctx.arc(ex, ey, 20, 0, Math.PI * 2);
                outlineStroke(5);
                const planetGrad = ctx.createRadialGradient(ex - 8, ey - 8, 5, ex, ey, 20);
                planetGrad.addColorStop(0, '#ffcc66');
                planetGrad.addColorStop(1, '#ee9933');
                ctx.fillStyle = planetGrad;
                ctx.fill();

                // Ring in front (bottom half)
                ctx.beginPath();
                ctx.ellipse(ex, ey, 28, 10, 0.2, Math.PI, Math.PI * 2);
                outlineStroke(4);
                ctx.fillStyle = ringGrad;
                ctx.fill();

                ctx.restore();

                // Happy face
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(ex - 6, ey - 4, 4, 0, Math.PI * 2);
                ctx.arc(ex + 6, ey - 4, 4, 0, Math.PI * 2);
                ctx.fill();

                // Eye shine
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(ex - 5, ey - 6, 2, 0, Math.PI * 2);
                ctx.arc(ex + 7, ey - 6, 2, 0, Math.PI * 2);
                ctx.fill();

                // Smile
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(ex, ey + 4, 10, 0.2, Math.PI - 0.2);
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(ex, ey + 4, 8, 0.2, Math.PI - 0.2);
                ctx.lineTo(ex, ey + 4);
                ctx.fill();

                // Rosy cheeks
                ctx.fillStyle = 'rgba(255, 150, 150, 0.6)';
                ctx.beginPath();
                ctx.arc(ex - 14, ey + 3, 4, 0, Math.PI * 2);
                ctx.arc(ex + 14, ey + 3, 4, 0, Math.PI * 2);
                ctx.fill();

            } else if (type.name === 'ovni') {
                // UFO (green from mural)
                const hover = Math.sin(frameCount * 0.05 + enemy.x) * 4;
                const tilt = Math.sin(frameCount * 0.03 + enemy.x) * 0.1;

                ctx.save();
                ctx.translate(ex, ey + hover);
                ctx.rotate(tilt);
                ctx.translate(-ex, -(ey + hover));

                // Light beam
                if (frameCount % 8 < 5) {
                    const beamGrad = ctx.createLinearGradient(ex, ey + hover + 12, ex, ey + hover + 35);
                    beamGrad.addColorStop(0, 'rgba(255, 255, 100, 0.5)');
                    beamGrad.addColorStop(1, 'rgba(255, 255, 100, 0)');
                    ctx.fillStyle = beamGrad;
                    ctx.beginPath();
                    ctx.moveTo(ex - 8, ey + hover + 12);
                    ctx.lineTo(ex - 16, ey + hover + 35);
                    ctx.lineTo(ex + 16, ey + hover + 35);
                    ctx.lineTo(ex + 8, ey + hover + 12);
                    ctx.closePath();
                    ctx.fill();
                }

                // Saucer base
                ctx.beginPath();
                ctx.ellipse(ex, ey + hover + 8, 24, 9, 0, 0, Math.PI * 2);
                outlineStroke(5);
                const saucerGrad = ctx.createLinearGradient(ex, ey + hover, ex, ey + hover + 16);
                saucerGrad.addColorStop(0, '#66ff99');
                saucerGrad.addColorStop(1, '#22bb66');
                ctx.fillStyle = saucerGrad;
                ctx.fill();

                // Dome
                ctx.beginPath();
                ctx.arc(ex, ey + hover, 14, Math.PI, 0, false);
                ctx.closePath();
                outlineStroke(5);
                const domeGrad = ctx.createRadialGradient(ex - 5, ey + hover - 8, 3, ex, ey + hover, 14);
                domeGrad.addColorStop(0, '#aaffcc');
                domeGrad.addColorStop(1, '#66dd99');
                ctx.fillStyle = domeGrad;
                ctx.fill();

                // Dome highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(ex - 5, ey + hover - 6, 5, 0, Math.PI * 2);
                ctx.fill();

                // Windows
                ctx.fillStyle = '#003322';
                ctx.beginPath();
                ctx.arc(ex - 7, ey + hover + 2, 3, 0, Math.PI * 2);
                ctx.arc(ex, ey + hover + 2, 3, 0, Math.PI * 2);
                ctx.arc(ex + 7, ey + hover + 2, 3, 0, Math.PI * 2);
                ctx.fill();

                // Light circles
                const lightColors = ['#ff6666', '#66ff66', '#6666ff'];
                ctx.fillStyle = lightColors[frameCount % 3];
                ctx.beginPath();
                ctx.arc(ex, ey + hover + 12, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

            } else if (type.name === 'alien') {
                // One-eyed alien (yellow from mural)
                const pulse = 1 + Math.sin(frameCount * 0.07 + enemy.x) * 0.12;
                const bob = Math.sin(frameCount * 0.06 + enemy.x) * 3;

                ctx.save();
                ctx.translate(ex, ey + bob);
                ctx.scale(pulse, 1 / pulse);
                ctx.translate(-ex, -(ey + bob));

                // Body
                ctx.beginPath();
                ctx.arc(ex, ey + bob, 20, 0, Math.PI * 2);
                outlineStroke(5);
                const alienGrad = ctx.createRadialGradient(ex - 8, ey + bob - 8, 5, ex, ey + bob, 20);
                alienGrad.addColorStop(0, '#ffee77');
                alienGrad.addColorStop(1, '#ffbb33');
                ctx.fillStyle = alienGrad;
                ctx.fill();

                ctx.restore();

                // Antenna
                const antennaWobble = Math.sin(frameCount * 0.12 + enemy.x) * 0.4;
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ex, ey - 20 + bob);
                ctx.quadraticCurveTo(ex + antennaWobble * 8, ey - 28 + bob, ex, ey - 32 + bob);
                ctx.stroke();

                outlineStroke(2);

                // Antenna ball
                ctx.beginPath();
                ctx.arc(ex, ey - 32 + bob, 4, 0, Math.PI * 2);
                outlineStroke(3);
                const ballGrad = ctx.createRadialGradient(ex - 2, ey - 34 + bob, 1, ex, ey - 32 + bob, 4);
                ballGrad.addColorStop(0, '#ffcc66');
                ballGrad.addColorStop(1, '#ff8800');
                ctx.fillStyle = ballGrad;
                ctx.fill();

                // Big eye
                ctx.beginPath();
                ctx.arc(ex, ey + bob, 13, 0, Math.PI * 2);
                outlineStroke(4);
                ctx.fillStyle = '#fff';
                ctx.fill();

                // Iris
                const irisGrad = ctx.createRadialGradient(ex - 3, ey - 3 + bob, 2, ex, ey + bob, 9);
                irisGrad.addColorStop(0, '#66bbff');
                irisGrad.addColorStop(1, '#2288dd');
                ctx.fillStyle = irisGrad;
                ctx.beginPath();
                ctx.arc(ex, ey + bob, 9, 0, Math.PI * 2);
                ctx.fill();

                // Pupil
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(ex + 2, ey + 2 + bob, 4, 0, Math.PI * 2);
                ctx.fill();

                // Eye shine
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(ex - 3, ey - 3 + bob, 4, 0, Math.PI * 2);
                ctx.fill();

                // Mouth
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(ex, ey + 14 + bob, 5, 0.3, Math.PI - 0.3);
                ctx.stroke();

            } else if (type.name === 'satelite') {
                // Satellite (blue/silver)
                const spin = Math.sin(frameCount * 0.05 + enemy.x) * 0.15;
                const float = Math.sin(frameCount * 0.04 + enemy.x) * 3;

                // Solar panels
                ctx.save();
                ctx.translate(ex - 18, ey + float);
                ctx.rotate(spin);
                ctx.translate(-(ex - 18), -(ey + float));

                ctx.beginPath();
                ctx.rect(ex - 28, ey - 10 + float, 14, 20);
                outlineStroke(5);
                const panelGrad = ctx.createLinearGradient(ex - 28, ey - 10 + float, ex - 28, ey + 10 + float);
                panelGrad.addColorStop(0, '#5599ff');
                panelGrad.addColorStop(0.5, '#3377dd');
                panelGrad.addColorStop(1, '#5599ff');
                ctx.fillStyle = panelGrad;
                ctx.fill();

                // Panel lines
                ctx.strokeStyle = '#1155aa';
                ctx.lineWidth = 2;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(ex - 28 + i * 5, ey - 10 + float);
                    ctx.lineTo(ex - 28 + i * 5, ey + 10 + float);
                    ctx.stroke();
                }

                ctx.restore();

                // Right panel
                ctx.save();
                ctx.translate(ex + 18, ey + float);
                ctx.rotate(-spin);
                ctx.translate(-(ex + 18), -(ey + float));

                ctx.beginPath();
                ctx.rect(ex + 14, ey - 10 + float, 14, 20);
                outlineStroke(5);
                ctx.fillStyle = panelGrad;
                ctx.fill();

                ctx.strokeStyle = '#1155aa';
                ctx.lineWidth = 2;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(ex + 14 + i * 5, ey - 10 + float);
                    ctx.lineTo(ex + 14 + i * 5, ey + 10 + float);
                    ctx.stroke();
                }

                ctx.restore();

                // Main body
                ctx.beginPath();
                ctx.roundRect(ex - 10, ey - 14 + float, 20, 28, 4);
                outlineStroke(5);
                const bodyGrad = ctx.createLinearGradient(ex - 10, ey - 14 + float, ex + 10, ey + 14 + float);
                bodyGrad.addColorStop(0, '#d0e0f0');
                bodyGrad.addColorStop(0.5, '#a0c0d0');
                bodyGrad.addColorStop(1, '#d0e0f0');
                ctx.fillStyle = bodyGrad;
                ctx.fill();

                // Body highlight
                ctx.fillStyle = '#fff';
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.roundRect(ex - 8, ey - 12 + float, 6, 20, 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                // Antenna
                const antennaWobble = Math.sin(frameCount * 0.08 + enemy.x) * 0.3;
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ex, ey - 14 + float);
                ctx.quadraticCurveTo(ex + antennaWobble * 6, ey - 22 + float, ex, ey - 26 + float);
                ctx.stroke();
                outlineStroke(3);

                // Antenna dish
                ctx.beginPath();
                ctx.arc(ex, ey - 26 + float, 5, 0, Math.PI * 2);
                outlineStroke(4);
                const dishGrad = ctx.createRadialGradient(ex - 2, ey - 28 + float, 1, ex, ey - 26 + float, 5);
                dishGrad.addColorStop(0, '#ffffcc');
                dishGrad.addColorStop(1, '#ffcc77');
                ctx.fillStyle = dishGrad;
                ctx.fill();

                // Blinking light
                if (frameCount % 6 < 2) {
                    ctx.beginPath();
                    ctx.arc(ex, ey + float, 4, 0, Math.PI * 2);
                    outlineStroke(3);
                    ctx.fillStyle = '#ff3333';
                    ctx.fill();

                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(ex - 1, ey - 1 + float, 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Glow
                    const glowGrad = ctx.createRadialGradient(ex, ey + float, 2, ex, ey + float, 8);
                    glowGrad.addColorStop(0, 'rgba(255, 50, 50, 0.8)');
                    glowGrad.addColorStop(1, 'rgba(255, 50, 50, 0)');
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(ex, ey + float, 8, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(ex - 4, ey - 3 + float, 2, 0, Math.PI * 2);
                ctx.arc(ex + 4, ey - 3 + float, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // Bullet drawing
        function drawBullet(bullet) {
            ctx.save();

            // Glow
            const glowGrad = ctx.createRadialGradient(bullet.x, bullet.y, 0, bullet.x, bullet.y, 12);
            glowGrad.addColorStop(0, 'rgba(100, 200, 255, 0.8)');
            glowGrad.addColorStop(1, 'rgba(100, 200, 255, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, 12, 0, Math.PI * 2);
            ctx.fill();

            // Bullet core
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
            outlineStroke(3);
            const bulletGrad = ctx.createRadialGradient(bullet.x - 2, bullet.y - 2, 1, bullet.x, bullet.y, 5);
            bulletGrad.addColorStop(0, '#ffffff');
            bulletGrad.addColorStop(0.3, '#aaffff');
            bulletGrad.addColorStop(1, '#00ccff');
            ctx.fillStyle = bulletGrad;
            ctx.fill();

            ctx.restore();
        }

        // Enemy bullet
        function drawEnemyBullet(bullet) {
            ctx.save();

            // Glow
            const glowGrad = ctx.createRadialGradient(bullet.x, bullet.y, 0, bullet.x, bullet.y, 10);
            glowGrad.addColorStop(0, 'rgba(255, 100, 50, 0.8)');
            glowGrad.addColorStop(1, 'rgba(255, 100, 50, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, 10, 0, Math.PI * 2);
            ctx.fill();

            // Bullet
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
            outlineStroke(2);
            const bulletGrad = ctx.createRadialGradient(bullet.x - 1, bullet.y - 1, 1, bullet.x, bullet.y, 4);
            bulletGrad.addColorStop(0, '#ffff88');
            bulletGrad.addColorStop(0.5, '#ff8844');
            bulletGrad.addColorStop(1, '#ff3333');
            ctx.fillStyle = bulletGrad;
            ctx.fill();

            ctx.restore();
        }

        // Particle system
        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 1,
                    decay: Math.random() * 0.02 + 0.01,
                    size: Math.random() * 4 + 2,
                    color: color,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.3
                });
            }
        }

        function updateAndDrawParticles() {
            particles = particles.filter(p => p.life > 0);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // gravity
                p.life -= p.decay;
                p.rotation += p.rotSpeed;

                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);

                // Star particle
                ctx.fillStyle = p.color;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                    const radius = i % 2 === 0 ? p.size : p.size / 2;
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            });
        }

        // Create enemies
        function createEnemies() {
            enemies = [];
            const rows = Math.min(3 + Math.floor(level / 2), 5);
            const cols = Math.min(5 + Math.floor(level / 2), 8);
            const types = Object.values(enemyTypes);

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const type = types[Math.floor(Math.random() * types.length)];
                    enemies.push({
                        x: 80 + col * 100,
                        y: 60 + row * 70,
                        type: type,
                        direction: 1,
                        shootCooldown: Math.random() * 100
                    });
                }
            }
        }

        // Game logic
        function updatePlayer() {
            if (keys['ArrowLeft'] && player.x > 20) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width - 20) {
                player.x += player.speed;
            }

            if (player.shootCooldown > 0) player.shootCooldown--;
        }

        function updateBullets() {
            bullets = bullets.filter(b => {
                b.y -= 8;
                return b.y > -20;
            });

            enemyBullets = enemyBullets.filter(b => {
                b.y += 5;
                return b.y < canvas.height + 20;
            });
        }

        function updateEnemies() {
            let changeDirection = false;

            enemies.forEach(enemy => {
                enemy.x += enemy.direction * 1;

                if (enemy.x <= 20 || enemy.x >= canvas.width - enemy.type.width - 20) {
                    changeDirection = true;
                }

                enemy.shootCooldown--;
                if (enemy.shootCooldown <= 0 && Math.random() < enemy.type.shootChance) {
                    enemyBullets.push({
                        x: enemy.x + enemy.type.width / 2,
                        y: enemy.y + enemy.type.height
                    });
                    enemy.shootCooldown = 60 + Math.random() * 80;
                }
            });

            if (changeDirection) {
                enemies.forEach(enemy => {
                    enemy.direction *= -1;
                    enemy.y += 15;
                });
            }
        }

        function checkCollisions() {
            // Player bullets hit enemies
            bullets.forEach((bullet, bIndex) => {
                enemies.forEach((enemy, eIndex) => {
                    const dx = bullet.x - (enemy.x + enemy.type.width / 2);
                    const dy = bullet.y - (enemy.y + enemy.type.height / 2);
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 25) {
                        bullets.splice(bIndex, 1);
                        createExplosion(
                            enemy.x + enemy.type.width / 2,
                            enemy.y + enemy.type.height / 2,
                            enemy.type.color
                        );
                        createExplosion(
                            enemy.x + enemy.type.width / 2,
                            enemy.y + enemy.type.height / 2,
                            '#ffff88'
                        );
                        enemies.splice(eIndex, 1);
                        score += enemy.type.points;
                        document.getElementById('score').textContent = score;
                    }
                });
            });

            // Enemy bullets hit player
            enemyBullets.forEach((bullet, bIndex) => {
                const dx = bullet.x - (player.x + player.width / 2);
                const dy = bullet.y - (player.y + player.height / 2);
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 30) {
                    enemyBullets.splice(bIndex, 1);
                    hp--;
                    updateHP();
                    createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#ff6600');

                    if (hp <= 0) {
                        endGame();
                    }
                }
            });

            // Enemies reach bottom
            enemies.forEach(enemy => {
                if (enemy.y + enemy.type.height >= player.y - 20) {
                    endGame();
                }
            });

            // Level complete
            if (enemies.length === 0 && gameRunning) {
                level++;
                document.getElementById('level').textContent = level;
                createEnemies();
            }
        }

        function shoot() {
            if (player.shootCooldown === 0) {
                bullets.push({
                    x: player.x + player.width / 2,
                    y: player.y
                });
                player.shootCooldown = 15;
            }
        }

        // Film effects (Cuphead style)
        function drawFilmEffects() {
            // Film grain
            const imageData = fxCtx.createImageData(fxCanvas.width, fxCanvas.height);
            const data = imageData.data;
            const grainIntensity = 0.08;

            for (let i = 0; i < data.length; i += 4) {
                if (Math.random() < 0.1) {
                    const noise = (Math.random() - 0.5) * 255 * grainIntensity;
                    data[i] = data[i + 1] = data[i + 2] = 128 + noise;
                    data[i + 3] = Math.abs(noise) * 2;
                }
            }
            fxCtx.putImageData(imageData, 0, 0);

            // Vignette
            const vignette = fxCtx.createRadialGradient(
                fxCanvas.width / 2, fxCanvas.height / 2, 200,
                fxCanvas.width / 2, fxCanvas.height / 2, fxCanvas.width * 0.7
            );
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignette.addColorStop(0.7, 'rgba(0, 0, 0, 0.3)');
            vignette.addColorStop(1, 'rgba(0, 0, 0, 0.7)');
            fxCtx.fillStyle = vignette;
            fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);

            // Scan lines
            fxCtx.globalAlpha = 0.05;
            fxCtx.strokeStyle = '#000';
            fxCtx.lineWidth = 1;
            for (let i = 0; i < fxCanvas.height; i += 4) {
                fxCtx.beginPath();
                fxCtx.moveTo(0, i);
                fxCtx.lineTo(fxCanvas.width, i);
                fxCtx.stroke();
            }
            fxCtx.globalAlpha = 1;

            // Film flicker
            if (Math.random() > 0.95) {
                fxCtx.globalAlpha = Math.random() * 0.1;
                fxCtx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
                fxCtx.fillRect(0, 0, fxCanvas.width, fxCanvas.height);
                fxCtx.globalAlpha = 1;
            }
        }

        // Update HP display
        function updateHP() {
            const container = document.getElementById('hpContainer');
            container.innerHTML = '';
            for (let i = 0; i < hp; i++) {
                const heart = document.createElement('div');
                heart.className = 'hp-heart';
                container.appendChild(heart);
            }
        }

        // Game loop
        function gameLoop() {
            if (!gameRunning) return;

            frameCount++;

            // Draw background
            drawBackground();

            // Clear main canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update
            updatePlayer();
            updateBullets();
            updateEnemies();
            checkCollisions();

            // Draw game elements
            drawPlayer();
            bullets.forEach(drawBullet);
            enemies.forEach(drawEnemy);
            enemyBullets.forEach(drawEnemyBullet);
            updateAndDrawParticles();

            // Clear effects canvas
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            drawFilmEffects();

            animationId = requestAnimationFrame(gameLoop);
        }

        // Game controls
        function startGame() {
            if (gameStarted) return;

            gameStarted = true;
            gameRunning = true;
            document.getElementById('startScreen').style.display = 'none';

            score = 0;
            hp = 3;
            level = 1;
            frameCount = 0;
            bullets = [];
            enemyBullets = [];
            particles = [];

            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            updateHP();

            initBackground();
            createEnemies();
            gameLoop();
        }

        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            document.getElementById('finalScore').textContent = 'PUNTOS: ' + score;
            document.getElementById('gameOver').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            gameStarted = false;
            startGame();
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (e.key === ' ' && gameRunning) {
                e.preventDefault();
                shoot();
            }

            if (e.key === 'p' || e.key === 'P') {
                if (gameStarted) {
                    gameRunning = !gameRunning;
                    if (gameRunning) gameLoop();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Initialize
        initBackground();
    </script>
</body>
</html>
