<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simi Invaders - Aventura Espacial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0f3d 0%, #2d1b4e 25%, #4a2c6b 50%, #3d4e8c 75%, #2e5f8f 100%);
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff, inset 0 0 30px rgba(255, 0, 255, 0.3);
            background: radial-gradient(ellipse at center, #1a2845 0%, #0d1520 60%, #000000 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            image-rendering: auto;
        }

        #stars {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 3;
            color: #00ffff;
            font-size: 12px;
            text-shadow: 2px 2px 4px #000, 0 0 10px #00ffff;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 4px solid #ff0000;
            box-shadow: 0 0 20px #ff0000;
            text-align: center;
            color: #ff0000;
            display: none;
        }

        #gameOver h1 {
            font-size: 24px;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        #gameOver p {
            font-size: 12px;
            margin: 10px 0;
            color: #00ff00;
        }

        #gameOver button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00ff00;
            border: none;
            color: #000;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px #00ff00;
        }

        #gameOver button:hover {
            background: #00cc00;
            transform: scale(1.05);
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ff00;
        }

        #startScreen h1 {
            font-size: 28px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 3px 3px 6px #000;
            animation: pulse 2s infinite, gradient 3s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #startScreen .instructions {
            font-size: 10px;
            margin: 10px 0;
            color: #ffff00;
        }

        #startScreen button {
            margin-top: 30px;
            padding: 15px 30px;
            background: #ff00ff;
            border: 3px solid #00ffff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff00ff;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="stars" width="800" height="600"></canvas>
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="ui">
            <div>PUNTOS: <span id="score">0</span></div>
            <div>VIDAS: <span id="lives">3</span></div>
            <div>NIVEL: <span id="level">1</span></div>
        </div>

        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p>PUNTOS FINALES: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">REINICIAR</button>
        </div>

        <div id="startScreen">
            <h1>🚀 SIMI INVADERS 🚀</h1>
            <div class="instructions">← → MOVER</div>
            <div class="instructions">ESPACIO DISPARAR</div>
            <div class="instructions">P PAUSAR</div>
            <button onclick="startGame()">INICIAR JUEGO</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const starsCanvas = document.getElementById('stars');
        const starsCtx = starsCanvas.getContext('2d');

        // Game state
        let gameStarted = false;
        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let animationId;

        // Player
        const player = {
            x: 400,
            y: 520,
            width: 40,
            height: 40,
            speed: 5,
            color: '#ff6600'
        };

        // Bullets
        let bullets = [];
        const bulletSpeed = 7;

        // Enemies
        let enemies = [];
        let enemyBullets = [];
        const enemyTypes = [
            { name: 'planeta', color: '#ffaa00', points: 10, width: 30, height: 30 },
            { name: 'ufo', color: '#00ff88', points: 20, width: 35, height: 25 },
            { name: 'alien', color: '#ffff00', points: 15, width: 28, height: 28 },
            { name: 'satelite', color: '#00aaff', points: 25, width: 32, height: 32 }
        ];

        // Controls
        const keys = {};

        // Stars background
        const stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * starsCanvas.width,
                y: Math.random() * starsCanvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1
            });
        }

        function drawStars() {
            starsCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            starsCtx.fillRect(0, 0, starsCanvas.width, starsCanvas.height);

            stars.forEach(star => {
                // Glow effect
                const starGlow = starsCtx.createRadialGradient(star.x, star.y, 0, star.x, star.y, star.size * 2);
                starGlow.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                starGlow.addColorStop(0.5, 'rgba(255, 255, 255, 0.4)');
                starGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                starsCtx.fillStyle = starGlow;
                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.size * 2, 0, Math.PI * 2);
                starsCtx.fill();

                // Star center
                starsCtx.fillStyle = '#ffffff';
                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.size / 2, 0, Math.PI * 2);
                starsCtx.fill();

                star.y += star.speed;
                if (star.y > starsCanvas.height) {
                    star.y = 0;
                    star.x = Math.random() * starsCanvas.width;
                }
            });
        }

        function drawPlayer() {
            const centerX = player.x + player.width / 2;
            const centerY = player.y + player.height / 2;

            ctx.save();

            // Shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;

            // Jetpack (behind player)
            const jetpackGradient = ctx.createLinearGradient(centerX - 5, centerY, centerX + 5, centerY + 15);
            jetpackGradient.addColorStop(0, '#666666');
            jetpackGradient.addColorStop(1, '#333333');
            ctx.fillStyle = jetpackGradient;
            ctx.beginPath();
            ctx.roundRect(centerX - 6, centerY + 2, 12, 18, 3);
            ctx.fill();

            // Jetpack details
            ctx.fillStyle = '#888888';
            ctx.beginPath();
            ctx.arc(centerX - 3, centerY + 8, 2, 0, Math.PI * 2);
            ctx.arc(centerX + 3, centerY + 8, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // Jetpack fire (animated)
            const fireFrame = (Date.now() / 80) % 1;
            const fireHeight = 6 + Math.sin(fireFrame * Math.PI * 2) * 3;

            // Red flame
            const flameGradient1 = ctx.createRadialGradient(centerX - 3, centerY + 20, 0, centerX - 3, centerY + 20, 5);
            flameGradient1.addColorStop(0, '#ffff00');
            flameGradient1.addColorStop(0.3, '#ff6600');
            flameGradient1.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = flameGradient1;
            ctx.beginPath();
            ctx.ellipse(centerX - 3, centerY + 20, 3, fireHeight, 0, 0, Math.PI * 2);
            ctx.fill();

            const flameGradient2 = ctx.createRadialGradient(centerX + 3, centerY + 20, 0, centerX + 3, centerY + 20, 5);
            flameGradient2.addColorStop(0, '#ffff00');
            flameGradient2.addColorStop(0.3, '#ff6600');
            flameGradient2.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = flameGradient2;
            ctx.beginPath();
            ctx.ellipse(centerX + 3, centerY + 20, 3, fireHeight, 0, 0, Math.PI * 2);
            ctx.fill();

            // Body (orange suit with gradient)
            const bodyGradient = ctx.createLinearGradient(centerX - 10, centerY, centerX + 10, centerY + 15);
            bodyGradient.addColorStop(0, '#ff8833');
            bodyGradient.addColorStop(0.5, '#ff6600');
            bodyGradient.addColorStop(1, '#cc5500');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.roundRect(centerX - 9, centerY + 2, 18, 22, 5);
            ctx.fill();

            // Belt
            ctx.fillStyle = '#555555';
            ctx.fillRect(centerX - 9, centerY + 12, 18, 3);
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.arc(centerX, centerY + 13.5, 2, 0, Math.PI * 2);
            ctx.fill();

            // Arms with gradient
            const armGradient = ctx.createLinearGradient(centerX - 15, centerY + 5, centerX - 10, centerY + 15);
            armGradient.addColorStop(0, '#ff9944');
            armGradient.addColorStop(1, '#ff7722');

            // Left arm (raised - punching up!)
            ctx.fillStyle = armGradient;
            ctx.beginPath();
            ctx.ellipse(centerX - 13, centerY + 3, 4, 8, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Left glove
            ctx.fillStyle = '#ffbb44';
            ctx.beginPath();
            ctx.arc(centerX - 15, centerY, 4, 0, Math.PI * 2);
            ctx.fill();

            // Right arm
            ctx.fillStyle = armGradient;
            ctx.beginPath();
            ctx.ellipse(centerX + 13, centerY + 8, 4, 9, 0.3, 0, Math.PI * 2);
            ctx.fill();

            // Right glove
            ctx.fillStyle = '#ffbb44';
            ctx.beginPath();
            ctx.arc(centerX + 15, centerY + 15, 4, 0, Math.PI * 2);
            ctx.fill();

            // Legs
            ctx.fillStyle = '#ff5522';
            ctx.beginPath();
            ctx.ellipse(centerX - 5, centerY + 27, 3.5, 6, 0, 0, Math.PI * 2);
            ctx.ellipse(centerX + 5, centerY + 27, 3.5, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Boots
            const bootGradient = ctx.createRadialGradient(centerX - 5, centerY + 32, 0, centerX - 5, centerY + 32, 5);
            bootGradient.addColorStop(0, '#dd4422');
            bootGradient.addColorStop(1, '#aa3311');
            ctx.fillStyle = bootGradient;
            ctx.beginPath();
            ctx.ellipse(centerX - 5, centerY + 32, 4.5, 3, 0, 0, Math.PI * 2);
            ctx.ellipse(centerX + 5, centerY + 32, 4.5, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Helmet (round with gradient like in mural)
            const helmetGradient = ctx.createRadialGradient(centerX - 3, centerY - 10, 2, centerX, centerY - 7, 14);
            helmetGradient.addColorStop(0, '#ffcc66');
            helmetGradient.addColorStop(0.6, '#ffaa33');
            helmetGradient.addColorStop(1, '#ff8811');
            ctx.fillStyle = helmetGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY - 7, 13, 0, Math.PI * 2);
            ctx.fill();

            // Helmet shine
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.ellipse(centerX - 4, centerY - 12, 4, 5, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Visor (cyan glass with transparency)
            const visorGradient = ctx.createLinearGradient(centerX - 8, centerY - 10, centerX + 8, centerY - 2);
            visorGradient.addColorStop(0, 'rgba(0, 221, 255, 0.8)');
            visorGradient.addColorStop(0.5, 'rgba(0, 187, 255, 0.9)');
            visorGradient.addColorStop(1, 'rgba(0, 153, 255, 0.7)');
            ctx.fillStyle = visorGradient;
            ctx.beginPath();
            ctx.ellipse(centerX, centerY - 6, 9, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Visor shine
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.ellipse(centerX - 3, centerY - 9, 3, 2, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // Face inside visor (skin tone)
            ctx.fillStyle = '#ffdd99';
            ctx.beginPath();
            ctx.ellipse(centerX, centerY - 5, 7, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Eyes (BIG happy eyes like in mural)
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(centerX - 3, centerY - 6, 1.5, 0, Math.PI * 2);
            ctx.arc(centerX + 3, centerY - 6, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Eye shine
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(centerX - 2.5, centerY - 6.5, 0.7, 0, Math.PI * 2);
            ctx.arc(centerX + 3.5, centerY - 6.5, 0.7, 0, Math.PI * 2);
            ctx.fill();

            // Big smile (like in mural)
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(centerX, centerY - 4, 4, 0.2, Math.PI - 0.2);
            ctx.stroke();

            // Rosy cheeks
            ctx.fillStyle = 'rgba(255, 100, 100, 0.4)';
            ctx.beginPath();
            ctx.arc(centerX - 6, centerY - 3, 2, 0, Math.PI * 2);
            ctx.arc(centerX + 6, centerY - 3, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawBullet(bullet) {
            ctx.save();

            // Glow effect (outer)
            const glowGradient = ctx.createRadialGradient(bullet.x + 2, bullet.y + 6, 0, bullet.x + 2, bullet.y + 6, 8);
            glowGradient.addColorStop(0, 'rgba(0, 255, 255, 0.8)');
            glowGradient.addColorStop(0.5, 'rgba(0, 255, 255, 0.3)');
            glowGradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
            ctx.fillStyle = glowGradient;
            ctx.fillRect(bullet.x - 4, bullet.y - 2, 12, 16);

            // Laser beam with gradient
            const laserGradient = ctx.createLinearGradient(bullet.x, bullet.y, bullet.x + 4, bullet.y);
            laserGradient.addColorStop(0, 'rgba(0, 255, 255, 0.6)');
            laserGradient.addColorStop(0.5, '#00ffff');
            laserGradient.addColorStop(1, 'rgba(0, 255, 255, 0.6)');
            ctx.fillStyle = laserGradient;
            ctx.beginPath();
            ctx.roundRect(bullet.x, bullet.y, 4, 12, 2);
            ctx.fill();

            // Inner bright core
            const coreGradient = ctx.createLinearGradient(bullet.x + 1, bullet.y, bullet.x + 3, bullet.y);
            coreGradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
            coreGradient.addColorStop(0.5, '#ffffff');
            coreGradient.addColorStop(1, 'rgba(255, 255, 255, 0.6)');
            ctx.fillStyle = coreGradient;
            ctx.fillRect(bullet.x + 1.5, bullet.y + 2, 1, 8);

            ctx.restore();
        }

        function drawEnemy(enemy) {
            const type = enemy.type;
            const centerX = enemy.x + type.width / 2;
            const centerY = enemy.y + type.height / 2;

            ctx.save();

            if (type.name === 'planeta') {
                // Saturn planet with BIG HAPPY FACE (like in mural - Flash style)

                // Shadow
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                // Ring behind (Saturn's ring)
                const ringGradient = ctx.createLinearGradient(centerX - 20, centerY, centerX + 20, centerY);
                ringGradient.addColorStop(0, 'rgba(255, 102, 51, 0.6)');
                ringGradient.addColorStop(0.5, '#ff8844');
                ringGradient.addColorStop(1, 'rgba(204, 85, 34, 0.6)');
                ctx.fillStyle = ringGradient;
                ctx.beginPath();
                ctx.ellipse(centerX, centerY, 18, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                // Planet body (round with gradient)
                const planetGradient = ctx.createRadialGradient(centerX - 5, centerY - 5, 2, centerX, centerY, 15);
                planetGradient.addColorStop(0, '#ffcc66');
                planetGradient.addColorStop(0.5, '#ffaa33');
                planetGradient.addColorStop(1, '#ff8811');
                ctx.fillStyle = planetGradient;
                ctx.beginPath();
                ctx.arc(centerX, centerY, 12, 0, Math.PI * 2);
                ctx.fill();

                // Ring in front
                ctx.fillStyle = ringGradient;
                ctx.beginPath();
                ctx.ellipse(centerX, centerY, 18, 5, 0, Math.PI, Math.PI * 2);
                ctx.fill();

                // BIG EYES (happy look)
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.ellipse(centerX - 4, centerY - 2, 2, 3, 0, 0, Math.PI * 2);
                ctx.ellipse(centerX + 4, centerY - 2, 2, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                // Eye shine
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(centerX - 3.5, centerY - 3, 1, 0, Math.PI * 2);
                ctx.arc(centerX + 4.5, centerY - 3, 1, 0, Math.PI * 2);
                ctx.fill();

                // BIG SMILE
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(centerX, centerY + 2, 6, 0.3, Math.PI - 0.3);
                ctx.stroke();

                // Rosy cheeks
                ctx.fillStyle = 'rgba(255, 85, 85, 0.6)';
                ctx.beginPath();
                ctx.arc(centerX - 9, centerY + 1, 2.5, 0, Math.PI * 2);
                ctx.arc(centerX + 9, centerY + 1, 2.5, 0, Math.PI * 2);
                ctx.fill();

            } else if (type.name === 'ufo') {
                // UFO (green like in mural - Flash style)

                // Shadow
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 3;

                // UFO base (saucer)
                const saucerGradient = ctx.createLinearGradient(centerX - 15, centerY, centerX + 15, centerY + 5);
                saucerGradient.addColorStop(0, '#00ff99');
                saucerGradient.addColorStop(0.5, '#00dd77');
                saucerGradient.addColorStop(1, '#00bb55');
                ctx.fillStyle = saucerGradient;
                ctx.beginPath();
                ctx.ellipse(centerX, centerY + 3, 15, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                // Dome (transparent green)
                const domeGradient = ctx.createRadialGradient(centerX - 2, centerY - 5, 2, centerX, centerY - 2, 10);
                domeGradient.addColorStop(0, 'rgba(136, 255, 204, 0.9)');
                domeGradient.addColorStop(0.5, 'rgba(0, 221, 119, 0.7)');
                domeGradient.addColorStop(1, 'rgba(0, 187, 102, 0.5)');
                ctx.fillStyle = domeGradient;
                ctx.beginPath();
                ctx.arc(centerX, centerY - 2, 8, Math.PI, Math.PI * 2);
                ctx.closePath();
                ctx.fill();

                // Dome top
                ctx.beginPath();
                ctx.ellipse(centerX, centerY - 2, 8, 3, 0, Math.PI, Math.PI * 2);
                ctx.fill();

                // Dome shine
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.ellipse(centerX - 3, centerY - 6, 3, 2, -0.2, 0, Math.PI * 2);
                ctx.fill();

                // Windows
                ctx.fillStyle = 'rgba(0, 102, 68, 0.8)';
                ctx.beginPath();
                ctx.arc(centerX - 4, centerY - 1, 1.5, 0, Math.PI * 2);
                ctx.arc(centerX, centerY - 1, 1.5, 0, Math.PI * 2);
                ctx.arc(centerX + 4, centerY - 1, 1.5, 0, Math.PI * 2);
                ctx.fill();

                // Bottom lights (animated)
                const blink = Math.floor(Date.now() / 200) % 3;
                const lightColors = ['#ffff00', '#ff00ff', '#00ffff'];
                ctx.beginPath();
                ctx.fillStyle = lightColors[blink];
                ctx.arc(centerX - 8, centerY + 7, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = lightColors[(blink + 1) % 3];
                ctx.beginPath();
                ctx.arc(centerX, centerY + 8, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = lightColors[(blink + 2) % 3];
                ctx.beginPath();
                ctx.arc(centerX + 8, centerY + 7, 2, 0, Math.PI * 2);
                ctx.fill();

                // Light glow
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.arc(centerX - 8, centerY + 7, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

            } else if (type.name === 'alien') {
                // Round alien with ONE BIG EYE (like in mural - Flash style)

                // Shadow
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                // Body (round with gradient)
                const bodyGradient = ctx.createRadialGradient(centerX - 4, centerY - 4, 2, centerX, centerY, 14);
                bodyGradient.addColorStop(0, '#ffee55');
                bodyGradient.addColorStop(0.6, '#ffdd33');
                bodyGradient.addColorStop(1, '#ffbb00');
                ctx.fillStyle = bodyGradient;
                ctx.beginPath();
                ctx.arc(centerX, centerY, 12, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                // Little antenna on top
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(centerX, centerY - 12);
                ctx.lineTo(centerX, centerY - 16);
                ctx.stroke();

                ctx.fillStyle = '#ff8800';
                ctx.beginPath();
                ctx.arc(centerX, centerY - 16, 2, 0, Math.PI * 2);
                ctx.fill();

                // ONE GIANT EYE
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(centerX, centerY - 2, 7, 0, Math.PI * 2);
                ctx.fill();

                // Eye outline
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(centerX, centerY - 2, 7, 0, Math.PI * 2);
                ctx.stroke();

                // Blue pupil with gradient
                const pupilGradient = ctx.createRadialGradient(centerX - 1, centerY - 3, 1, centerX, centerY - 2, 4);
                pupilGradient.addColorStop(0, '#0088ff');
                pupilGradient.addColorStop(1, '#0044cc');
                ctx.fillStyle = pupilGradient;
                ctx.beginPath();
                ctx.arc(centerX, centerY - 2, 4, 0, Math.PI * 2);
                ctx.fill();

                // Pupil inner dark
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(centerX + 0.5, centerY - 1.5, 2, 0, Math.PI * 2);
                ctx.fill();

                // Pupil shine (large)
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(centerX - 1, centerY - 3, 1.5, 0, Math.PI * 2);
                ctx.fill();

                // Small smile
                ctx.strokeStyle = '#ff6600';
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(centerX, centerY + 5, 4, 0.2, Math.PI - 0.2);
                ctx.stroke();

            } else if (type.name === 'satelite') {
                // Satellite (Flash style)

                // Shadow
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                // Solar panels (left)
                const panelGradient = ctx.createLinearGradient(centerX - 15, centerY - 3, centerX - 15, centerY + 3);
                panelGradient.addColorStop(0, '#0099ff');
                panelGradient.addColorStop(0.5, '#0077dd');
                panelGradient.addColorStop(1, '#0055bb');
                ctx.fillStyle = panelGradient;
                ctx.beginPath();
                ctx.roundRect(centerX - 18, centerY - 4, 8, 8, 1);
                ctx.fill();

                // Solar panel grid
                ctx.strokeStyle = '#004488';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(centerX - 16, centerY - 4);
                ctx.lineTo(centerX - 16, centerY + 4);
                ctx.moveTo(centerX - 14, centerY - 4);
                ctx.lineTo(centerX - 14, centerY + 4);
                ctx.stroke();

                // Solar panels (right)
                ctx.fillStyle = panelGradient;
                ctx.beginPath();
                ctx.roundRect(centerX + 10, centerY - 4, 8, 8, 1);
                ctx.fill();

                ctx.strokeStyle = '#004488';
                ctx.beginPath();
                ctx.moveTo(centerX + 12, centerY - 4);
                ctx.lineTo(centerX + 12, centerY + 4);
                ctx.moveTo(centerX + 14, centerY - 4);
                ctx.lineTo(centerX + 14, centerY + 4);
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                // Main body
                const bodyGradient = ctx.createLinearGradient(centerX - 4, centerY - 6, centerX + 4, centerY + 6);
                bodyGradient.addColorStop(0, '#0099ff');
                bodyGradient.addColorStop(0.5, '#0077cc');
                bodyGradient.addColorStop(1, '#0055aa');
                ctx.fillStyle = bodyGradient;
                ctx.beginPath();
                ctx.roundRect(centerX - 4, centerY - 6, 8, 12, 2);
                ctx.fill();

                // Body details
                ctx.fillStyle = '#005599';
                ctx.fillRect(centerX - 3, centerY - 5, 6, 1);
                ctx.fillRect(centerX - 3, centerY, 6, 1);
                ctx.fillRect(centerX - 3, centerY + 4, 6, 1);

                // Antenna on top
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY - 6);
                ctx.lineTo(centerX, centerY - 10);
                ctx.stroke();

                // Antenna dishes
                ctx.fillStyle = '#eeeeee';
                ctx.beginPath();
                ctx.ellipse(centerX - 3, centerY - 10, 3, 1.5, 0, 0, Math.PI * 2);
                ctx.ellipse(centerX + 3, centerY - 10, 3, 1.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // Blinking light
                if (Math.random() > 0.7) {
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Glow
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.restore();
        }

        function drawEnemyBullet(bullet) {
            ctx.save();

            // Outer glow
            const glowGradient = ctx.createRadialGradient(bullet.x + 3, bullet.y + 4, 0, bullet.x + 3, bullet.y + 4, 10);
            glowGradient.addColorStop(0, 'rgba(255, 100, 0, 0.6)');
            glowGradient.addColorStop(0.5, 'rgba(255, 0, 0, 0.3)');
            glowGradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = glowGradient;
            ctx.beginPath();
            ctx.arc(bullet.x + 3, bullet.y + 4, 8, 0, Math.PI * 2);
            ctx.fill();

            // Energy ball with gradient (red to yellow center)
            const ballGradient = ctx.createRadialGradient(bullet.x + 3, bullet.y + 3, 1, bullet.x + 3, bullet.y + 4, 5);
            ballGradient.addColorStop(0, '#ffff00');
            ballGradient.addColorStop(0.4, '#ff8800');
            ballGradient.addColorStop(0.7, '#ff3300');
            ballGradient.addColorStop(1, '#cc0000');
            ctx.fillStyle = ballGradient;
            ctx.beginPath();
            ctx.arc(bullet.x + 3, bullet.y + 4, 4, 0, Math.PI * 2);
            ctx.fill();

            // Bright center
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(bullet.x + 2, bullet.y + 3, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Flame trail
            const trailGradient = ctx.createLinearGradient(bullet.x + 3, bullet.y + 8, bullet.x + 3, bullet.y + 12);
            trailGradient.addColorStop(0, 'rgba(255, 100, 0, 0.6)');
            trailGradient.addColorStop(0.5, 'rgba(255, 50, 0, 0.3)');
            trailGradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = trailGradient;
            ctx.beginPath();
            ctx.moveTo(bullet.x + 3, bullet.y + 8);
            ctx.lineTo(bullet.x + 1, bullet.y + 11);
            ctx.lineTo(bullet.x + 5, bullet.y + 11);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function createEnemies() {
            enemies = [];
            const rows = 3 + Math.floor(level / 2);
            const cols = 6 + Math.floor(level / 3);
            const spacing = 60;
            const startX = 50;
            const startY = 50;

            for (let row = 0; row < Math.min(rows, 5); row++) {
                for (let col = 0; col < Math.min(cols, 10); col++) {
                    const typeIndex = Math.floor(Math.random() * enemyTypes.length);
                    enemies.push({
                        x: startX + col * spacing,
                        y: startY + row * 50,
                        type: enemyTypes[typeIndex],
                        direction: 1,
                        shootCooldown: Math.random() * 100
                    });
                }
            }
        }

        function updatePlayer() {
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
        }

        function updateBullets() {
            bullets = bullets.filter(bullet => {
                bullet.y -= bulletSpeed;
                return bullet.y > 0;
            });

            enemyBullets = enemyBullets.filter(bullet => {
                bullet.y += 3;
                return bullet.y < canvas.height;
            });
        }

        function updateEnemies() {
            let changeDirection = false;

            enemies.forEach(enemy => {
                enemy.x += enemy.direction * 0.5;

                if (enemy.x <= 0 || enemy.x >= canvas.width - enemy.type.width) {
                    changeDirection = true;
                }

                // Enemy shooting
                enemy.shootCooldown--;
                if (enemy.shootCooldown <= 0 && Math.random() < 0.002) {
                    enemyBullets.push({
                        x: enemy.x + enemy.type.width / 2,
                        y: enemy.y + enemy.type.height
                    });
                    enemy.shootCooldown = 100 + Math.random() * 100;
                }
            });

            if (changeDirection) {
                enemies.forEach(enemy => {
                    enemy.direction *= -1;
                    enemy.y += 10;
                });
            }
        }

        function checkCollisions() {
            // Bullet hits enemy
            bullets.forEach((bullet, bulletIndex) => {
                enemies.forEach((enemy, enemyIndex) => {
                    if (bullet.x >= enemy.x && bullet.x <= enemy.x + enemy.type.width &&
                        bullet.y >= enemy.y && bullet.y <= enemy.y + enemy.type.height) {
                        bullets.splice(bulletIndex, 1);
                        enemies.splice(enemyIndex, 1);
                        score += enemy.type.points;
                        document.getElementById('score').textContent = score;
                    }
                });
            });

            // Enemy bullet hits player
            enemyBullets.forEach((bullet, bulletIndex) => {
                if (bullet.x >= player.x && bullet.x <= player.x + player.width &&
                    bullet.y >= player.y && bullet.y <= player.y + player.height) {
                    enemyBullets.splice(bulletIndex, 1);
                    lives--;
                    document.getElementById('lives').textContent = lives;

                    if (lives <= 0) {
                        endGame();
                    }
                }
            });

            // Enemy reaches bottom
            enemies.forEach(enemy => {
                if (enemy.y + enemy.type.height >= player.y) {
                    endGame();
                }
            });

            // Level complete
            if (enemies.length === 0) {
                level++;
                document.getElementById('level').textContent = level;
                createEnemies();
            }
        }

        function shoot() {
            bullets.push({
                x: player.x + player.width / 2,
                y: player.y
            });
        }

        function gameLoop() {
            if (!gameRunning) return;

            drawStars();

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updatePlayer();
            updateBullets();
            updateEnemies();
            checkCollisions();

            drawPlayer();
            bullets.forEach(drawBullet);
            enemies.forEach(drawEnemy);
            enemyBullets.forEach(drawEnemyBullet);

            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (gameStarted) return;

            gameStarted = true;
            gameRunning = true;
            document.getElementById('startScreen').style.display = 'none';

            score = 0;
            lives = 3;
            level = 1;
            bullets = [];
            enemyBullets = [];

            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;

            createEnemies();
            gameLoop();
        }

        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            gameStarted = false;
            startGame();
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (e.key === ' ' && gameRunning) {
                e.preventDefault();
                shoot();
            }

            if (e.key === 'p' || e.key === 'P') {
                gameRunning = !gameRunning;
                if (gameRunning) gameLoop();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Start star animation
        setInterval(drawStars, 50);
    </script>
</body>
</html>
