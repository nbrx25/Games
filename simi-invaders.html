<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simi Invaders - Aventura Espacial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0f3d 0%, #2d1b4e 25%, #4a2c6b 50%, #3d4e8c 75%, #2e5f8f 100%);
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff, inset 0 0 30px rgba(255, 0, 255, 0.3);
            background: radial-gradient(ellipse at center, #1a2845 0%, #0d1520 60%, #000000 100%);
            overflow: hidden;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #stars {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 3;
            color: #00ffff;
            font-size: 12px;
            text-shadow: 2px 2px 4px #000, 0 0 10px #00ffff;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 4px solid #ff0000;
            box-shadow: 0 0 20px #ff0000;
            text-align: center;
            color: #ff0000;
            display: none;
        }

        #gameOver h1 {
            font-size: 24px;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        #gameOver p {
            font-size: 12px;
            margin: 10px 0;
            color: #00ff00;
        }

        #gameOver button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00ff00;
            border: none;
            color: #000;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px #00ff00;
        }

        #gameOver button:hover {
            background: #00cc00;
            transform: scale(1.05);
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ff00;
        }

        #startScreen h1 {
            font-size: 28px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 3px 3px 6px #000;
            animation: pulse 2s infinite, gradient 3s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #startScreen .instructions {
            font-size: 10px;
            margin: 10px 0;
            color: #ffff00;
        }

        #startScreen button {
            margin-top: 30px;
            padding: 15px 30px;
            background: #ff00ff;
            border: 3px solid #00ffff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff00ff;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="stars" width="800" height="600"></canvas>
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="ui">
            <div>PUNTOS: <span id="score">0</span></div>
            <div>VIDAS: <span id="lives">3</span></div>
            <div>NIVEL: <span id="level">1</span></div>
        </div>

        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p>PUNTOS FINALES: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">REINICIAR</button>
        </div>

        <div id="startScreen">
            <h1>🚀 SIMI INVADERS 🚀</h1>
            <div class="instructions">← → MOVER</div>
            <div class="instructions">ESPACIO DISPARAR</div>
            <div class="instructions">P PAUSAR</div>
            <button onclick="startGame()">INICIAR JUEGO</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const starsCanvas = document.getElementById('stars');
        const starsCtx = starsCanvas.getContext('2d');

        // Game state
        let gameStarted = false;
        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let animationId;

        // Player
        const player = {
            x: 400,
            y: 520,
            width: 40,
            height: 40,
            speed: 5,
            color: '#ff6600'
        };

        // Bullets
        let bullets = [];
        const bulletSpeed = 7;

        // Enemies
        let enemies = [];
        let enemyBullets = [];
        const enemyTypes = [
            { name: 'planeta', color: '#ffaa00', points: 10, width: 30, height: 30 },
            { name: 'ufo', color: '#00ff88', points: 20, width: 35, height: 25 },
            { name: 'alien', color: '#ffff00', points: 15, width: 28, height: 28 },
            { name: 'satelite', color: '#00aaff', points: 25, width: 32, height: 32 }
        ];

        // Controls
        const keys = {};

        // Stars background
        const stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * starsCanvas.width,
                y: Math.random() * starsCanvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1
            });
        }

        function drawStars() {
            starsCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            starsCtx.fillRect(0, 0, starsCanvas.width, starsCanvas.height);

            stars.forEach(star => {
                starsCtx.fillStyle = '#ffffff';
                starsCtx.fillRect(star.x, star.y, star.size, star.size);

                star.y += star.speed;
                if (star.y > starsCanvas.height) {
                    star.y = 0;
                    star.x = Math.random() * starsCanvas.width;
                }
            });
        }

        function drawPlayer() {
            // Body (orange suit)
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(player.x + 11, player.y + 18, 18, 20);

            // Body outline
            ctx.fillStyle = '#cc4400';
            ctx.fillRect(player.x + 11, player.y + 18, 2, 20);
            ctx.fillRect(player.x + 27, player.y + 18, 2, 20);

            // Helmet (round orange)
            ctx.fillStyle = '#ffaa33';
            ctx.fillRect(player.x + 13, player.y + 8, 14, 14);
            ctx.fillRect(player.x + 11, player.y + 10, 18, 10);

            // Helmet shine
            ctx.fillStyle = '#ffcc66';
            ctx.fillRect(player.x + 14, player.y + 9, 3, 3);

            // Visor (cyan/blue glass)
            ctx.fillStyle = '#00ddff';
            ctx.fillRect(player.x + 14, player.y + 12, 12, 6);
            ctx.fillRect(player.x + 16, player.y + 11, 8, 8);

            // Visor shine
            ctx.fillStyle = '#88ffff';
            ctx.fillRect(player.x + 17, player.y + 13, 2, 2);

            // Face inside visor (big smile)
            ctx.fillStyle = '#ffdd88';
            ctx.fillRect(player.x + 17, player.y + 13, 6, 4);

            // Eyes
            ctx.fillStyle = '#000000';
            ctx.fillRect(player.x + 18, player.y + 14, 1, 1);
            ctx.fillRect(player.x + 21, player.y + 14, 1, 1);

            // Smile
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(player.x + 18, player.y + 16, 4, 1);

            // Arms (punching up - one raised)
            ctx.fillStyle = '#ff8833';
            ctx.fillRect(player.x + 6, player.y + 20, 5, 8);
            ctx.fillRect(player.x + 29, player.y + 16, 5, 6);

            // Gloves
            ctx.fillStyle = '#ffaa33';
            ctx.fillRect(player.x + 6, player.y + 27, 5, 4);
            ctx.fillRect(player.x + 29, player.y + 21, 5, 4);

            // Legs
            ctx.fillStyle = '#ff4400';
            ctx.fillRect(player.x + 13, player.y + 34, 6, 4);
            ctx.fillRect(player.x + 21, player.y + 34, 6, 4);

            // Boots
            ctx.fillStyle = '#cc3300';
            ctx.fillRect(player.x + 12, player.y + 36, 7, 3);
            ctx.fillRect(player.x + 21, player.y + 36, 7, 3);

            // Jetpack
            ctx.fillStyle = '#555555';
            ctx.fillRect(player.x + 16, player.y + 20, 8, 12);

            // Jetpack details
            ctx.fillStyle = '#777777';
            ctx.fillRect(player.x + 17, player.y + 22, 2, 8);
            ctx.fillRect(player.x + 21, player.y + 22, 2, 8);

            // Jetpack fire (animated)
            const fireFrame = Math.floor(Date.now() / 100) % 3;
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(player.x + 17, player.y + 32, 2, 3 + fireFrame);
            ctx.fillRect(player.x + 21, player.y + 32, 2, 3 + fireFrame);

            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(player.x + 17, player.y + 34 + fireFrame, 2, 2);
            ctx.fillRect(player.x + 21, player.y + 34 + fireFrame, 2, 2);

            ctx.fillStyle = '#ffff00';
            ctx.fillRect(player.x + 17, player.y + 35 + fireFrame, 2, 1);
            ctx.fillRect(player.x + 21, player.y + 35 + fireFrame, 2, 1);
        }

        function drawBullet(bullet) {
            // Laser beam style
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(bullet.x, bullet.y, 4, 12);
            ctx.fillStyle = '#88ffff';
            ctx.fillRect(bullet.x + 1, bullet.y + 1, 2, 10);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(bullet.x + 1, bullet.y + 2, 2, 6);

            // Glow effect
            ctx.fillStyle = '#00ffff';
            ctx.globalAlpha = 0.3;
            ctx.fillRect(bullet.x - 1, bullet.y, 6, 12);
            ctx.globalAlpha = 1.0;
        }

        function drawEnemy(enemy) {
            const type = enemy.type;

            if (type.name === 'planeta') {
                // Saturn planet with BIG HAPPY FACE (like in mural)
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(enemy.x + 6, enemy.y + 6, 18, 18);
                ctx.fillRect(enemy.x + 4, enemy.y + 9, 22, 12);

                // Planet shading
                ctx.fillStyle = '#ff9900';
                ctx.fillRect(enemy.x + 8, enemy.y + 8, 14, 14);

                // Ring (colorful like mural)
                ctx.fillStyle = '#ff6633';
                ctx.fillRect(enemy.x, enemy.y + 13, 30, 4);
                ctx.fillStyle = '#ff8844';
                ctx.fillRect(enemy.x + 2, enemy.y + 14, 26, 2);

                // Ring behind planet
                ctx.fillStyle = '#cc5522';
                ctx.fillRect(enemy.x, enemy.y + 13, 6, 4);
                ctx.fillRect(enemy.x + 24, enemy.y + 13, 6, 4);

                // BIG EYES (happy look)
                ctx.fillStyle = '#000000';
                ctx.fillRect(enemy.x + 9, enemy.y + 12, 3, 4);
                ctx.fillRect(enemy.x + 18, enemy.y + 12, 3, 4);

                // Eye shine
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(enemy.x + 10, enemy.y + 13, 1, 1);
                ctx.fillRect(enemy.x + 19, enemy.y + 13, 1, 1);

                // BIG SMILE
                ctx.fillStyle = '#000000';
                ctx.fillRect(enemy.x + 10, enemy.y + 18, 10, 2);
                ctx.fillRect(enemy.x + 9, enemy.y + 17, 2, 2);
                ctx.fillRect(enemy.x + 19, enemy.y + 17, 2, 2);

                // Rosy cheeks
                ctx.fillStyle = '#ff5555';
                ctx.fillRect(enemy.x + 7, enemy.y + 16, 2, 2);
                ctx.fillRect(enemy.x + 21, enemy.y + 16, 2, 2);

            } else if (type.name === 'ufo') {
                // UFO (green like in mural)
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(enemy.x + 7, enemy.y + 10, 21, 8);
                ctx.fillRect(enemy.x + 5, enemy.y + 12, 25, 4);

                // Dome (transparent green)
                ctx.fillStyle = '#00dd77';
                ctx.fillRect(enemy.x + 12, enemy.y + 6, 11, 8);
                ctx.fillRect(enemy.x + 14, enemy.y + 4, 7, 4);

                // Dome shine
                ctx.fillStyle = '#88ffcc';
                ctx.fillRect(enemy.x + 15, enemy.y + 5, 3, 2);

                // Windows/portholes
                ctx.fillStyle = '#006644';
                ctx.fillRect(enemy.x + 14, enemy.y + 8, 2, 3);
                ctx.fillRect(enemy.x + 17, enemy.y + 8, 2, 3);
                ctx.fillRect(enemy.x + 20, enemy.y + 8, 2, 3);

                // Bottom lights (animated blinking)
                const blink = Math.floor(Date.now() / 200) % 3;
                ctx.fillStyle = blink === 0 ? '#ffff00' : '#ff00ff';
                ctx.fillRect(enemy.x + 8, enemy.y + 16, 3, 2);
                ctx.fillStyle = blink === 1 ? '#ffff00' : '#ff00ff';
                ctx.fillRect(enemy.x + 15, enemy.y + 16, 3, 2);
                ctx.fillStyle = blink === 2 ? '#ffff00' : '#ff00ff';
                ctx.fillRect(enemy.x + 22, enemy.y + 16, 3, 2);

                // UFO outline highlights
                ctx.fillStyle = '#00cc66';
                ctx.fillRect(enemy.x + 7, enemy.y + 10, 21, 2);

            } else if (type.name === 'alien') {
                // Round alien with ONE BIG EYE (like in mural)
                ctx.fillStyle = '#ffdd00';
                ctx.fillRect(enemy.x + 7, enemy.y + 6, 14, 18);
                ctx.fillRect(enemy.x + 5, enemy.y + 10, 18, 10);

                // Body shading
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(enemy.x + 8, enemy.y + 8, 12, 14);

                // ONE GIANT EYE (white)
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(enemy.x + 9, enemy.y + 11, 10, 8);
                ctx.fillRect(enemy.x + 11, enemy.y + 10, 6, 10);

                // Eye outline/shadow
                ctx.fillStyle = '#000000';
                ctx.fillRect(enemy.x + 10, enemy.y + 11, 8, 1);

                // Blue pupil (big)
                ctx.fillStyle = '#0066ff';
                ctx.fillRect(enemy.x + 12, enemy.y + 13, 4, 5);

                // Pupil shine
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(enemy.x + 13, enemy.y + 14, 2, 2);

                // Mouth (small smile)
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(enemy.x + 11, enemy.y + 20, 6, 2);

                // Little antenna/details on top
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(enemy.x + 13, enemy.y + 5, 2, 2);

            } else if (type.name === 'satelite') {
                // Satellite (more detailed)
                ctx.fillStyle = '#0099ff';
                ctx.fillRect(enemy.x + 13, enemy.y + 10, 6, 12);

                // Body details
                ctx.fillStyle = '#0077cc';
                ctx.fillRect(enemy.x + 14, enemy.y + 11, 4, 10);

                // Solar panels (blue/cyan)
                ctx.fillStyle = '#0088dd';
                ctx.fillRect(enemy.x + 3, enemy.y + 13, 9, 6);
                ctx.fillRect(enemy.x + 20, enemy.y + 13, 9, 6);

                // Solar panel grid lines
                ctx.fillStyle = '#006699';
                ctx.fillRect(enemy.x + 5, enemy.y + 14, 1, 4);
                ctx.fillRect(enemy.x + 7, enemy.y + 14, 1, 4);
                ctx.fillRect(enemy.x + 22, enemy.y + 14, 1, 4);
                ctx.fillRect(enemy.x + 24, enemy.y + 14, 1, 4);

                // Antenna on top
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(enemy.x + 15, enemy.y + 6, 2, 4);
                ctx.fillRect(enemy.x + 13, enemy.y + 5, 6, 2);
                ctx.fillRect(enemy.x + 14, enemy.y + 4, 4, 2);

                // Blinking light
                if (Math.random() > 0.7) {
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(enemy.x + 15, enemy.y + 15, 2, 2);
                }
            }
        }

        function drawEnemyBullet(bullet) {
            // Energy ball style
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(bullet.x + 1, bullet.y + 1, 4, 6);
            ctx.fillRect(bullet.x + 2, bullet.y, 2, 8);

            ctx.fillStyle = '#ff6600';
            ctx.fillRect(bullet.x + 2, bullet.y + 2, 2, 4);

            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(bullet.x + 2, bullet.y + 3, 2, 2);

            // Glow effect
            ctx.fillStyle = '#ff0000';
            ctx.globalAlpha = 0.4;
            ctx.fillRect(bullet.x, bullet.y, 6, 8);
            ctx.globalAlpha = 1.0;
        }

        function createEnemies() {
            enemies = [];
            const rows = 3 + Math.floor(level / 2);
            const cols = 6 + Math.floor(level / 3);
            const spacing = 60;
            const startX = 50;
            const startY = 50;

            for (let row = 0; row < Math.min(rows, 5); row++) {
                for (let col = 0; col < Math.min(cols, 10); col++) {
                    const typeIndex = Math.floor(Math.random() * enemyTypes.length);
                    enemies.push({
                        x: startX + col * spacing,
                        y: startY + row * 50,
                        type: enemyTypes[typeIndex],
                        direction: 1,
                        shootCooldown: Math.random() * 100
                    });
                }
            }
        }

        function updatePlayer() {
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
        }

        function updateBullets() {
            bullets = bullets.filter(bullet => {
                bullet.y -= bulletSpeed;
                return bullet.y > 0;
            });

            enemyBullets = enemyBullets.filter(bullet => {
                bullet.y += 3;
                return bullet.y < canvas.height;
            });
        }

        function updateEnemies() {
            let changeDirection = false;

            enemies.forEach(enemy => {
                enemy.x += enemy.direction * 0.5;

                if (enemy.x <= 0 || enemy.x >= canvas.width - enemy.type.width) {
                    changeDirection = true;
                }

                // Enemy shooting
                enemy.shootCooldown--;
                if (enemy.shootCooldown <= 0 && Math.random() < 0.002) {
                    enemyBullets.push({
                        x: enemy.x + enemy.type.width / 2,
                        y: enemy.y + enemy.type.height
                    });
                    enemy.shootCooldown = 100 + Math.random() * 100;
                }
            });

            if (changeDirection) {
                enemies.forEach(enemy => {
                    enemy.direction *= -1;
                    enemy.y += 10;
                });
            }
        }

        function checkCollisions() {
            // Bullet hits enemy
            bullets.forEach((bullet, bulletIndex) => {
                enemies.forEach((enemy, enemyIndex) => {
                    if (bullet.x >= enemy.x && bullet.x <= enemy.x + enemy.type.width &&
                        bullet.y >= enemy.y && bullet.y <= enemy.y + enemy.type.height) {
                        bullets.splice(bulletIndex, 1);
                        enemies.splice(enemyIndex, 1);
                        score += enemy.type.points;
                        document.getElementById('score').textContent = score;
                    }
                });
            });

            // Enemy bullet hits player
            enemyBullets.forEach((bullet, bulletIndex) => {
                if (bullet.x >= player.x && bullet.x <= player.x + player.width &&
                    bullet.y >= player.y && bullet.y <= player.y + player.height) {
                    enemyBullets.splice(bulletIndex, 1);
                    lives--;
                    document.getElementById('lives').textContent = lives;

                    if (lives <= 0) {
                        endGame();
                    }
                }
            });

            // Enemy reaches bottom
            enemies.forEach(enemy => {
                if (enemy.y + enemy.type.height >= player.y) {
                    endGame();
                }
            });

            // Level complete
            if (enemies.length === 0) {
                level++;
                document.getElementById('level').textContent = level;
                createEnemies();
            }
        }

        function shoot() {
            bullets.push({
                x: player.x + player.width / 2,
                y: player.y
            });
        }

        function gameLoop() {
            if (!gameRunning) return;

            drawStars();

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updatePlayer();
            updateBullets();
            updateEnemies();
            checkCollisions();

            drawPlayer();
            bullets.forEach(drawBullet);
            enemies.forEach(drawEnemy);
            enemyBullets.forEach(drawEnemyBullet);

            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (gameStarted) return;

            gameStarted = true;
            gameRunning = true;
            document.getElementById('startScreen').style.display = 'none';

            score = 0;
            lives = 3;
            level = 1;
            bullets = [];
            enemyBullets = [];

            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;

            createEnemies();
            gameLoop();
        }

        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            gameStarted = false;
            startGame();
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (e.key === ' ' && gameRunning) {
                e.preventDefault();
                shoot();
            }

            if (e.key === 'p' || e.key === 'P') {
                gameRunning = !gameRunning;
                if (gameRunning) gameLoop();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Start star animation
        setInterval(drawStars, 50);
    </script>
</body>
</html>
